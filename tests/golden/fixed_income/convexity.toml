# tests/golden/fixed_income/convexity.toml
model = "fixed_income.convexity"

[[sources]]
key = "zero_coupon_convexity"
kind = "identity"
citation = "A zero-coupon bond n periods from maturity has P = F (1 + y/f)^-n, so P'' / P = n (n + 1) / (f^2 (1 + y/f)^2)."

[[sources]]
key = "zero_coupon_bump"
kind = "identity"
citation = "Off a flat curve z, a zero-coupon bond n periods out has effective convexity ((1 + (z - h)/f)^-n + (1 + (z + h)/f)^-n - 2 (1 + z/f)^-n) / ((1 + z/f)^-n h^2)."

[[sources]]
key = "zero_coupon_reprice"
kind = "identity"
citation = "For a zero-coupon bond, the repriced change is ((1 + (y + dy)/f) / (1 + y/f))^-n - 1, the estimate is -D_mod dy + C dy^2 / 2, and their difference is the approximation error."

[[cases]]
id = "zero_coupon_ten_years"
source = "zero_coupon_convexity"
edge = false
inputs = { calculation = "analytical", settlement = 2026-01-15, maturity = 2036-01-15, coupon_rate = 0.0, yield_to_maturity = 0.05 }
expected = { convexity = 99.94051160023795, full_price = 61.02709428588309 }

