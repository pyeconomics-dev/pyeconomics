citation = "US 30/360: May 30, 1993 to April 15, 1995 is 675/360 years; to May 31, 1994 is 360/360. Remaining time is 315/360 = 0.875 years. P=100(1.05)^(-t), D=t, modified D=t/1.05, C=t(t+1)/1.05^2. Values computed independently with 60-digit Decimal arithmetic."
