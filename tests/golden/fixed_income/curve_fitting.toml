# tests/golden/fixed_income/curve_fitting.toml
model = "fixed_income.curve_fitting"

[[sources]]
key = "gsw_file"
kind = "official"
citation = "Board of Governors of the Federal Reserve System. The U.S. Treasury Yield Curve: 1961 to the Present (Gurkaynak, Sack and Wright), daily data file feds200628.csv (Last-Modified 13 October 2026, data through 2026-10-09), accessed 2026-10-19. Parameters BETA0-BETA3 and the yields are in percent (divided by 100 here), TAU1 and TAU2 in years; SVENY are continuously compounded zero yields, SVENF continuously compounded instantaneous forwards, SVENPY par yields with semiannual coupons (the paper's equation 7). Rows from 1987-12-01 to 2001-08-10 print 12 decimals; recent rows print 4."
url = "https://www.federalreserve.gov/data/yield-curve-tables/feds200628.csv"

[[sources]]
key = "ecb_aaa"
kind = "official"
citation = "European Central Bank. Euro area yield curves, AAA-rated central government bonds (series YC.B.U2.EUR.4F.G_N_A.SV_C_YM.*): the Svensson parameters BETA0-BETA3 (percent) and TAU1-TAU2 (years), spot rates SR_ and instantaneous forwards IF_ (continuously compounded, percent) and par yields PY_, from the ECB Data Portal, accessed 2026-10-19. Until 2023-05-18 PY is the par yield with monthly coupons, (1 - d(T)) / (sum of d(j/12) / 12), and values carry full double precision; from 2023-05-19 PY uses continuous coupons and values print 10 decimals."
url = "https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A+G_N_C.SV_C_YM.?startPeriod=2020-03-12&endPeriod=2020-03-12&format=csvdata"

