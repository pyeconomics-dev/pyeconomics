[[cases]]
id = "zero_coupon_negative_yield"
source = "zero_coupon"
edge = true
inputs = { calculation = "price_from_yield", settlement = 2026-01-15, maturity = 2036-01-15, coupon_rate = 0.0, yield_to_maturity = -0.005 }
expected = { full_price = 105.13369125928598, flat_price = 105.13369125928598 }
note = "A zero coupon at a negative yield: 100 / (1 - 0.0025)^20."

[[cases]]
id = "callable_at_par_yields_its_coupon"
source = "par_bond"
edge = false
inputs = { calculation = "yield_to_worst", settlement = 2026-01-15, maturity = 2036-01-15, coupon_rate = 0.045, price = 100.0, call_dates = [2029-01-15, 2031-01-15], call_prices = [100.0, 100.0] }
expected = { yield_to_worst = 0.045, yield_to_maturity = 0.045, full_price = 100.0 }
tolerance = { yield_to_worst = { abs = 1e-10 }, yield_to_maturity = { abs = 1e-10 } }
note = "Priced at par on a coupon date and callable at par, every yield is the coupon rate."

[[sources]]
key = "us_30_360_long_stub"
kind = "identity"
citation = "US 30/360: May 30, 1993 to April 15, 1995 is 675/360 years; to May 31, 1994 is 360/360. Remaining time is 315/360 = 0.875 years. P=100(1.05)^(-t), D=t, modified D=t/1.05, C=t(t+1)/1.05^2. Values computed independently with 60-digit Decimal arithmetic."
url = "https://github.com/lballabio/QuantLib/blob/v1.43/ql/time/daycounters/thirty360.cpp"

