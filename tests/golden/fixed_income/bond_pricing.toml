# tests/golden/fixed_income/bond_pricing.toml
model = "fixed_income.bond_pricing"

[[sources]]
key = "cfr356b"
kind = "official"
citation = "US Department of the Treasury. 31 CFR Part 356, Appendix B: Formulas and Tables. Electronic Code of Federal Regulations, as amended through 87 FR 40440 (July 7, 2022)."
url = "https://www.ecfr.gov/current/title-31/subtitle-B/chapter-II/subchapter-B/part-356/appendix-Appendix%20B%20to%20Part%20356"

[[sources]]
key = "par_bond"
kind = "identity"
citation = "On a coupon date, a bond whose yield equals its coupon rate and that repays its face value is worth its face value: c/f times the annuity factor at c/f, plus the discount factor, is one."

[[sources]]
key = "zero_coupon"
kind = "identity"
citation = "A zero-coupon bond n coupon periods from maturity, settled on a coupon date, is worth F / (1 + y/f)^n."

[[cases]]
id = "regular_first_period"
source = "cfr356b"
locator = "Section II.A, example (8 3/4% 30-year bond issued May 15, 1990, at 8.84%)"
edge = true
inputs = { calculation = "price_from_yield", settlement = 1990-05-15, maturity = 2020-05-15, coupon_rate = 0.0875, yield_to_maturity = 0.0884, convention = "treasury" }
expected = { flat_price = 99.057893, accrued_interest = 0.0 }
tolerance = { flat_price = { abs = 1e-6 } }
note = "Settlement on a coupon date. Treasury prints P to six decimals; the tolerance is one unit in the sixth."

[[cases]]
id = "short_first_period"
