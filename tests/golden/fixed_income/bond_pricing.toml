edge = true
inputs = { calculation = "price_from_yield", settlement = 1994-05-31, maturity = 1995-04-15, issue_date = 1993-05-30, first_period = "long", frequency = "annual", day_count = "thirty_360_us", coupon_rate = 0.0, yield_to_maturity = 0.05 }
expected = { full_price = 95.8207053225834014468942316629923789283676453686158334830090, flat_price = 95.8207053225834014468942316629923789283676453686158334830090, accrued_interest = 0.0 }
note = "Regression for #89: splitting US 30/360 at the notional April 15 grid changed the remaining time by one day."
