locator = "Chapter 15, the same worked example: the European put"
edge = false
inputs = { calculation = "price", option_type = "put", spot = 42.0, strike = 40.0, years = 0.5, risk_free_rate = 0.10, volatility = 0.20 }
expected = { price = 0.81 }
tolerance = { price = { abs = 0.005 } }

