[[sources]]
key = "hull2018"
kind = "textbook"
citation = "Hull, J. C. (2018). Options, Futures, and Other Derivatives, 10th ed. Pearson."
isbn = "9780134472089"
published_digits = 2

[[sources]]
key = "hull2018b"
kind = "textbook"
citation = "Hull, J. C. (2018). Options, Futures, and Other Derivatives, 10th ed. Pearson. Values printed to three decimals."
isbn = "9780134472089"
published_digits = 3

[[sources]]
key = "haug2007"
kind = "textbook"
citation = "Haug, E. G. (2007). The Complete Guide to Option Pricing Formulas, 2nd ed. McGraw-Hill."
isbn = "9780071389976"
published_digits = 4

[[sources]]
key = "black1973"
kind = "paper"
citation = "Black, F. and Scholes, M. (1973). The Pricing of Options and Corporate Liabilities. Journal of Political Economy, 81(3), 637-654."
doi = "10.1086/260062"

[[sources]]
key = "atm_forward"
kind = "identity"
citation = "With r = q = 0 and S = K, d1 = sigma sqrt(T) / 2 and d2 = -d1, so c = p = S (2 N(sigma sqrt(T) / 2) - 1)."

[[sources]]
key = "high_volatility"
kind = "identity"
citation = "As sigma sqrt(T) grows, N(d1) tends to 1 and N(d2) to 0, so a call tends to its upper bound S e^(-qT)."

[[sources]]
key = "put_call_parity"
kind = "identity"
citation = "For European options with the same terms, c - p = S e^(-qT) - K e^(-rT) at any rates, negative ones included."

[[sources]]
key = "no_arbitrage"
kind = "identity"
citation = "A European call lies strictly between max(S e^(-qT) - K e^(-rT), 0) and S e^(-qT); a price outside has no implied volatility."

[[cases]]
id = "six_month_call"
source = "hull2018"
locator = "Chapter 15, the worked example of a six-month option with S0 = 42, K = 40, r = 10% and sigma = 20%"
edge = false
inputs = { calculation = "price", option_type = "call", spot = 42.0, strike = 40.0, years = 0.5, risk_free_rate = 0.10, volatility = 0.20 }
expected = { price = 4.76 }
tolerance = { price = { abs = 0.005 } }

[[cases]]
id = "six_month_put"
