# tests/golden/asset_pricing/factor_regression.toml
model = "asset_pricing.factor_regression"

[[sources]]
key = "nist_strd"
kind = "certified"
citation = "NIST Statistical Reference Datasets, linear least squares regression: certified parameter estimates, their standard deviations, the residual standard deviation and R-squared (15 significant digits). Each dataset is rescaled to return-sized numbers (each column divided by a power of ten or two) and the certified values rescaled to match: a coefficient on x / s_x of y / s_y is the certified one times s_x / s_y, which leaves R-squared unchanged."
url = "https://www.itl.nist.gov/div898/strd/lls/lls.shtml"

[[sources]]
key = "identity"
kind = "identity"
citation = "Least squares by hand: with a single factor of mean zero, beta = sum(f (y - mean y)) / sum(f^2), alpha = mean y, s^2 = e'e / (T - 2), se(beta) = s / sqrt(sum f^2), se(alpha) = s / sqrt(T); the security market line is r_f + beta times the premium, and annualized alpha is alpha times P."

