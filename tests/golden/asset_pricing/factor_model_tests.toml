# tests/golden/asset_pricing/factor_model_tests.toml
model = "asset_pricing.factor_model_tests"

[[sources]]
key = "nist_strd"
kind = "certified"
citation = "NIST Statistical Reference Datasets, linear least squares regression: Norris, certified intercept B0 and its standard deviation. For one asset on one factor the GRS statistic is the square of the intercept's classical t statistic, (T - 2) a^2 / (s_e^2 (1 + f^2 / s_f^2)) with divisor T for both variances (Gibbons, Ross and Shanken 1989, eq. 5)."
url = "https://www.itl.nist.gov/div898/strd/lls/lls.shtml"

[[sources]]
key = "grs1989"
kind = "paper"
citation = "Gibbons, M. R., Ross, S. A. and Shanken, J. (1989). A Test of the Efficiency of a Given Portfolio. Econometrica, 57(5), 1121-1152. The statistic for L portfolios applied to synthetic returns, both covariances at divisor T (as Cochrane 2005, eq. 12.6), recomputed with exact rational arithmetic."
doi = "10.2307/1913625"

[[sources]]
key = "fm1973"
kind = "paper"
citation = "Fama, E. F. and MacBeth, J. D. (1973). Risk, Return, and Equilibrium: Empirical Tests. Journal of Political Economy, 81(3), 607-636; with Shanken (1992)'s correction in his eq. (11) form. Applied to synthetic returns: time-series betas, a cross-section a period, the average and its error with divisor T (Cochrane 2005, p. 246; Goyal 2012, eq. 32), recomputed with exact rational arithmetic and 50-digit square roots."
doi = "10.1086/260061"

[[sources]]
key = "identity"
kind = "identity"
citation = "Closed forms: with zero estimated alphas the GRS statistic is zero and its p-value one; F(1, 1) is the square of a Student t with one degree of freedom, so P(F > w) = 1 - (2 / pi) arctan(sqrt w); when each return is exactly g0 + b_i f_t, the residuals vanish, every cross-section returns (g0, f_t), the premium is the factor's mean and its error the factor's standard deviation (divisor T) over sqrt(T)."

