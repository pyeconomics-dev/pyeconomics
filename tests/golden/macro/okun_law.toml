# tests/golden/macro/okun_law.toml
model = "macro.okun_law"

[[sources]]
key = "knotek2007"
kind = "paper"
citation = "Knotek, E. S. II (2007). How Useful Is Okun's Law? Federal Reserve Bank of Kansas City Economic Review, 92(4), 73-103. Reproduced from public-domain data as available on August 15, 2007 (the article's endnote 10): US real GDP in billions of chained 2000 dollars as BEA released it on July 27, 2007, and the BLS seasonally adjusted civilian unemployment rate (LNS14000000) as released on August 3, 2007; values retrieved from ALFRED vintages GDPC1 2007-07-27 and UNRATE 2007-08-03 (identical to the Philadelphia Fed real-time files ROUTPUT07Q3 and RUC07Q3), accessed 2026-10-19."
url = "https://www.kansascityfed.org/Economic%20Review/documents/955/2007-How%20Useful%20is%20Okun%27s%20Law%3F.pdf"

[[sources]]
key = "okun_identity"
kind = "identity"
citation = "A dependent series that is an exact line in the regressor is fitted exactly: least squares returns that line's slope and intercept."

[[cases]]
id = "knotek_quarterly_1948q2_2007q2"
source = "knotek2007"
locator = "p. 78 and endnote 20, p. 99: the change in unemployment = 0.231 - 0.066 x real GDP growth (annualized), 1948Q2-2007Q2"
edge = false
expected = { intercept = 0.00231, slope = -0.066, observations = 237 }
tolerance = { intercept = { abs = 5e-6 }, slope = { abs = 5e-4 } }
note = "Quarterly averages of the monthly unemployment rate, as decimals; growth compounded to an annual rate, (Y/Y(-1))^4 - 1, the form that reproduces the published slope at three decimals (simple or log annualization does not). The intercept is 0.231 percentage points, 0.00231 as a decimal; half a unit of the published third decimal is the tolerance."

