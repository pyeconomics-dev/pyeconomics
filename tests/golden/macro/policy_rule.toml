# tests/golden/macro/policy_rule.toml
model = "macro.policy_rule"

[[sources]]
key = "mpr2026_box4"
kind = "identity"
citation = "The rules of table A, box 4 (Monetary Policy Rules in the Current Environment), Monetary Policy Report, Board of Governors of the Federal Reserve System, July 2026: Taylor (1993), adjusted Taylor (1993), balanced approach and first difference, in the unemployment form (a coefficient of 2 on the gap converts it to output-gap units)."

[[sources]]
key = "mpr2023_box"
kind = "identity"
citation = "The balanced-approach (shortfalls) rule of table A, box Monetary Policy Rules in the Current Environment, Monetary Policy Report, Board of Governors of the Federal Reserve System, June 2023: 2 min(u* - u, 0) in place of the balanced approach's 2 (u* - u)."

[[sources]]
key = "taylor_identity"
kind = "identity"
citation = "Any of the level rules with inflation at its target and no resource gap prescribes the nominal neutral rate, r* plus the target."

[[sources]]
key = "atlanta_tru"
kind = "official"
citation = "Federal Reserve Bank of Atlanta. Taylor Rule Utility, data file taylor-rule-data.xlsx (updated October 14, 2026), accessed 2026-10-18. Prescriptions are rho x lagged rate + (1 - rho)(r* + pi* + 1.5(pi - pi*) + w x gap), with the gap in output-gap units."
url = "https://www.atlantafed.org/cqer/research/taylor-rule"

[[sources]]
key = "cleveland_rules"
kind = "official"
citation = "Federal Reserve Bank of Cleveland. Simple Monetary Policy Rules, spreadsheet policy_rules_spreadsheet.xlsx, based on data and forecasts available as of September 3, 2026 (updated September 4, 2026), accessed 2026-10-18. Inputs from its Parameters and Forecasts worksheets, prescriptions from its Policy Rule Funds Rates worksheet, all in percent."
url = "https://www.clevelandfed.org/indicators-and-data/simple-monetary-policy-rules"

[[cases]]
id = "mpr_taylor_1993"
source = "mpr2026_box4"
edge = false
inputs = { calculation = "taylor_1993", inflation = 0.03, neutral_real_rate = 0.005, unemployment = 0.04, natural_unemployment = 0.042 }
expected = { prescribed_rate = 0.042, inflation_gap_term = 0.005, resource_gap_term = 0.002, nominal_neutral_rate = 0.025 }
note = "0.005 + 0.03 + 0.5(0.03 - 0.02) + (0.042 - 0.04)."

[[cases]]
id = "mpr_balanced_approach"
source = "mpr2026_box4"
edge = false
inputs = { calculation = "balanced_approach", inflation = 0.03, neutral_real_rate = 0.005, unemployment = 0.04, natural_unemployment = 0.042 }
expected = { prescribed_rate = 0.044, resource_gap_term = 0.004 }
note = "Twice the Taylor (1993) weight on the unemployment gap."

[[cases]]
id = "mpr_shortfalls_ignore_a_tight_labour_market"
source = "mpr2023_box"
edge = false
inputs = { calculation = "balanced_approach_shortfalls", inflation = 0.03, neutral_real_rate = 0.005, unemployment = 0.04, natural_unemployment = 0.042 }
expected = { prescribed_rate = 0.04, resource_gap_term = 0.0 }

[[cases]]
id = "mpr_shortfalls_answer_slack"
source = "mpr2023_box"
edge = false
inputs = { calculation = "balanced_approach_shortfalls", inflation = 0.03, neutral_real_rate = 0.005, unemployment = 0.05, natural_unemployment = 0.042 }
expected = { prescribed_rate = 0.024, resource_gap_term = -0.016 }
note = "With unemployment above its natural rate the shortfalls rule is the balanced approach."

[[cases]]
id = "mpr_adjusted_rule_at_the_lower_bound"
source = "mpr2026_box4"
edge = true
inputs = { calculation = "adjusted_taylor_1993", inflation = 0.01, neutral_real_rate = 0.005, unemployment = 0.08, natural_unemployment = 0.045, cumulative_shortfall = 0.02 }
expected = { prescribed_rate = 0.00125, unconstrained_rate = -0.045 }
note = "Taylor (1993) prescribes -0.025; less a shortfall of 0.02 it is -0.045, and the 12.5 basis point lower bound binds."

[[cases]]
id = "mpr_adjusted_rule_after_liftoff"
source = "mpr2026_box4"
edge = false
inputs = { calculation = "adjusted_taylor_1993", inflation = 0.025, neutral_real_rate = 0.005, unemployment = 0.04, natural_unemployment = 0.042, cumulative_shortfall = 0.01 }
expected = { prescribed_rate = 0.0245 }
note = "Taylor (1993) prescribes 0.0345; the shortfall still to make up holds the rate 0.01 lower."

[[cases]]
id = "mpr_first_difference"
source = "mpr2026_box4"
edge = false
inputs = { calculation = "first_difference", inflation = 0.03, previous_rate = 0.0425, unemployment = 0.043, natural_unemployment = 0.042, unemployment_lagged = 0.04 }
expected = { prescribed_rate = 0.0445, resource_gap_term = -0.003 }
note = "0.0425 + 0.5(0.03 - 0.02) - (0.043 - 0.04): with the natural rate unchanged the gap's change is the unemployment rate's."

[[cases]]
id = "negative_inflation_and_no_gap"
source = "mpr2026_box4"
edge = true
inputs = { calculation = "taylor_1993", inflation = -0.01, neutral_real_rate = 0.005, output_gap = 0.0 }
expected = { prescribed_rate = -0.02, inflation_gap_term = -0.015, resource_gap_term = 0.0 }
note = "Deflation of 1%: 0.005 - 0.01 + 0.5(-0.01 - 0.02). With no lower bound the rule prescribes a negative rate."

