[[cases]]
id = "mrw1992_textbook_convergence"
source = "mankiw1992"
locator = "Section III.A, eq. (13) and p. 423: with alpha = 1/3 and n + g + delta = 0.06 the textbook model converges at 4% a year, halfway in about 17 years"
edge = false
inputs = { calculation = "steady_state", saving_rate = 0.2, capital_share = 0.3333333333333333, population_growth = 0.01, technology_growth = 0.02, depreciation = 0.03 }
expected = { convergence_speed = 0.04, half_life = 17.328679513998633 }
note = "lambda = (n + g + delta)(1 - alpha) = 0.06 x 2/3; the half-life ln 2 / lambda is 17.33 years."

[[cases]]
id = "solow1956_cobb_douglas"
source = "solow1956"
locator = "Section IV, Example 2, pp. 76-77: r* = (s / n)^(1 / (1 - a)), Y/L = r*^a, K/Y = s / n"
edge = false
inputs = { calculation = "steady_state", saving_rate = 0.2, capital_share = 0.5, population_growth = 0.02, technology_growth = 0.0, depreciation = 0.0 }
expected = { capital_per_effective_worker = 100.0, output_per_effective_worker = 10.0, capital_output_ratio = 10.0, consumption_per_effective_worker = 8.0 }
note = "Solow's model has no depreciation or technical progress: (0.2 / 0.02)^2 = 100."

