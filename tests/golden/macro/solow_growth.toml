[[cases]]
id = "solow1957_table1_tornqvist"
source = "solow1957"
locator = "Table 1, p. 315, columns (4) share of property in income, (5) private nonfarm GNP per man-hour and (6) employed capital per man-hour, 1909-1949"
edge = false
expected = { output_growth = 0.017903873470126834, capital_contribution = 0.002130456931881753, labour_contribution = 0.0, tfp_growth = 0.015773416538245082, tfp_share = 0.881005809416801, periods = 40 }
note = "Recomputed in 50-digit arithmetic from the table's data columns, not its printed column (7), whose 1924, 1931 and 1942 entries carry slips (Hogan 1958 found the 1942 one): log growth of output and capital per man-hour (labour growth zero), each year's capital share the average of its two years' (a Tornqvist index). TFP explains 0.881 of the log growth; Solow's own arithmetic attributes about seven-eighths (p. 316)."

