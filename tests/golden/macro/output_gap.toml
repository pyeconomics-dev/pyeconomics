# tests/golden/macro/output_gap.toml
model = "macro.output_gap"

[[sources]]
key = "cbo_history"
kind = "official"
citation = "Congressional Budget Office (2026). Historical Data and Economic Projections, February 2026 (publication 55022): quarterly real GDP, real potential GDP and the output gap (percent of potential), as CBO publishes them in its US-CBO/cbo-data repository, file data/economic/historical_economic/quarterly_2026-02.csv, accessed 2026-10-19."
url = "https://github.com/US-CBO/cbo-data/blob/main/data/economic/historical_economic/quarterly_2026-02.csv"

[[sources]]
key = "cbo_projections"
kind = "official"
citation = "Congressional Budget Office (2026). The Budget and Economic Outlook: 2026 to 2036, 10-Year Economic Projections (publication 51135), file 51135-2026-02-Economic-Projections.xlsx, sheet 1. Quarterly, accessed 2026-10-19; the output gap is published to 0.1 percent."
url = "https://www.cbo.gov/data/budget-economic-data"

[[sources]]
key = "gap_identity"
kind = "identity"
citation = "Output at potential has a zero gap in either form; actual over potential less one is CBO's definition of the output gap."

[[sources]]
key = "filter_recomputed"
kind = "identity"
citation = "The filters' defining equations, recomputed independently in 50-digit arithmetic (mpmath) on the log of US real GDP, 2001Q2-2007Q2, in billions of chained 2000 dollars as BEA published it on July 27, 2007 (the 2007 annual revision): Hodrick and Prescott (1997) with lambda 1,600; Baxter and King (1999) with 6 to 32 quarters and K = 12; Christiano and Fitzgerald (2003) with the same band and the drift removed; Hamilton (2018) with h = 8 and p = 4."

[[cases]]
id = "cbo_output_gap_2019q4_2020q2_2024q4"
source = "cbo_history"
locator = "Lines 21919/25087/15975 (2019q4), 21921/25089/15977 (2020q2) and 21939/25107/15995 (2024q4): real_gdp, real_potential_gdp, output_gap"
edge = false
expected = { cycle = [0.012671041794982907, -0.08830491723208767, 0.013534054499414694], gap = 0.013534054499414694, trend = [20722.820278145697, 20925.85598035592, 23271.54168652911] }
note = "CBO's gap divided by 100; the ratio form reproduces it to every stored digit (the log form misses 2020Q2 by 0.41 points)."

[cases.inputs]
calculation = "from_potential"
actual = [20985.4, 19078.0, 23586.5]
potential = [20722.820278145697, 20925.85598035592, 23271.54168652911]

[[cases]]
id = "cbo_output_gap_published_2024q4"
source = "cbo_projections"
locator = "Sheet 1. Quarterly, column J (2024Q4): real GDP J13, real potential GDP J23, output gap J31 (1.4)"
edge = false
inputs = { calculation = "from_potential", actual = [23586.5], potential = [23271.5] }
expected = { gap = 0.014 }
tolerance = { gap = { abs = 0.0005 } }
note = "CBO publishes the gap to 0.1 percent, computed from unrounded levels; half a unit of that precision is 0.0005."

[[cases]]
id = "no_gap_at_potential"
source = "gap_identity"
edge = true
inputs = { calculation = "from_potential", actual = [21000.0], potential = [21000.0], form = "log" }
expected = { cycle = [0.0], gap = 0.0, trend = [21000.0], start = 0 }
note = "A single period, the shortest series."

