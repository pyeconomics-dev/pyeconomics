# tests/golden/international/parity_conditions.toml
model = "international.parity_conditions"

[[sources]]
key = "interest_parity"
kind = "identity"
citation = "Covered (and uncovered) interest parity: F = S Gq(T) / Gb(T), each currency's growth at its rate, simple (1 + iT), periodic ((1 + i/m)^(mT)) or continuous (e^(iT))."

[[sources]]
key = "relative_ppp"
kind = "identity"
citation = "Relative purchasing power parity: E[S_T] = S ((1 + pi_q) / (1 + pi_b))^T."

[[sources]]
key = "absolute_ppp"
kind = "identity"
citation = "Absolute purchasing power parity: the exchange rate equating a basket's prices is P_q / P_b."

[[sources]]
key = "fisher"
kind = "identity"
citation = "The Fisher relation (1 + i) = (1 + r)(1 + pi) gives each real rate; with equal real rates, the expected change in the spot rate is (1 + i_q) / (1 + i_b) - 1."

[[sources]]
key = "real_exchange_rate"
kind = "identity"
citation = "The real exchange rate is S P_b / P_q, and its change is (1 + s)(1 + pi_b) / (1 + pi_q) - 1."

[[cases]]
id = "two_year_continuous_forward"
source = "interest_parity"
edge = false
inputs = { calculation = "covered_interest_parity", spot = 0.75, quote_rate = 0.01, base_rate = 0.03, years = 2.0, compounding = "continuous" }
expected = { forward_rate = 0.7205920793642424, forward_premium = -0.03921056084767682 }

