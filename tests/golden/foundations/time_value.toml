[[cases]]
id = "annuity_present_value"
source = "microsoft_pv"
locator = "Example (=PV(A3/12, 12*A4, A2, , 0))"
edge = false
inputs = { calculation = "solve", rate = 0.006666666666666667, periods = 240, payment = 500, future_value = 0 }
expected = { present_value = -59777.15 }
tolerance = { present_value = { abs = 0.005 } }
note = "500 a month for 20 years at 8% a year (0.08 / 12 a month). Published as ($59,777.15): the cash-flow sign convention."

