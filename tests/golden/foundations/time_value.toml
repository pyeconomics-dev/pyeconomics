[[sources]]
key = "zero_rate_annuity"
kind = "identity"
citation = "At a zero rate the annuity factor (1 - (1 + r)^-n) / r tends to n, so n payments are worth n times the payment."

[[sources]]
key = "level_perpetuity"
kind = "identity"
citation = "A level perpetuity in arrears is worth PMT / r for r > 0, the limit of the annuity factor as n grows."

[[sources]]
key = "single_sum"
kind = "identity"
citation = "A single sum F due in n periods is worth F / (1 + r)^n now, and P now is worth P (1 + r)^n then."

[[sources]]
key = "single_flow"
kind = "identity"
citation = "The NPV of one cash flow at time 0 is that cash flow, at any rate."

[[sources]]
key = "same_sign_flows"
kind = "identity"
citation = "A cash-flow series that never changes sign has a present value of one sign at every rate, so it has no IRR."

[[sources]]
key = "zero_rate_loan"
kind = "identity"
citation = "At a zero rate a level-payment loan of P over n periods repays P / n each period and pays no interest."

[[cases]]
id = "xirr_spreadsheet_example"
source = "microsoft_xirr"
locator = "Example (=XIRR(A3:A7, B3:B7, 0.1))"
edge = false
inputs = { calculation = "xirr", cash_flows = [-10000, 2750, 4250, 3250, 2750], dates = [2008-01-01, 2008-03-01, 2008-10-30, 2009-02-15, 2009-04-01] }
expected = { xirr = 0.373362535, sign_changes = 1 }
tolerance = { xirr = { abs = 2e-8 } }
note = "Published as 0.373362535. Excel stops iterating once the rate is accurate within 0.000001 percent, so the published digits can differ from the root (0.3733625335) in the ninth decimal; the tolerance allows that."

[[cases]]
id = "xnpv_spreadsheet_example"
source = "microsoft_xnpv"
locator = "Example (=XNPV(.09, A2:A6, B2:B6))"
edge = false
inputs = { calculation = "xnpv", rate = 0.09, cash_flows = [-10000, 2750, 4250, 3250, 2750], dates = [2008-01-01, 2008-03-01, 2008-10-30, 2009-02-15, 2009-04-01] }
expected = { xnpv = 2086.65 }
tolerance = { xnpv = { abs = 0.005 } }
note = "Published to the cent."

