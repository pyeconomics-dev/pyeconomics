[[sources]]
key = "kupiec1995"
kind = "paper"
citation = "Kupiec, P. H. (1995). Techniques for verifying the accuracy of risk measurement models. The Journal of Derivatives, 3(2), 73-84. The proportion-of-failures likelihood ratio; synthetic counts, 50-digit decimal logarithms."
