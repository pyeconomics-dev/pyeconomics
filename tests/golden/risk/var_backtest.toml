[[sources]]
key = "christ1998"
kind = "paper"
citation = "Christoffersen, P. F. (1998). Evaluating interval forecasts. International Economic Review, 39(4), 841-862. The Markov likelihood ratios of independence and conditional coverage; a synthetic series, 50-digit decimal logarithms."
