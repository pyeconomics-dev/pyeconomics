# tests/golden/risk/value_at_risk.toml
model = "risk.value_at_risk"

[[sources]]
key = "normal"
kind = "identity"
citation = "Normal VaR and ES: VaR = -mu h + z sigma sqrt(h), ES = -mu h + sigma sqrt(h) phi(z) / (1 - c), with z the standard normal quantile at c. Quantiles and densities computed to 40 digits with mpmath."

[[sources]]
key = "bcbs2019"
kind = "official"
citation = "Basel Committee on Banking Supervision (2019). Minimum capital requirements for market risk. Bank for International Settlements. ES at the 97.5th percentile against VaR at the 99th; the values are the normal identities at the levels the framework sets, to 40 digits with mpmath."
url = "https://www.bis.org/bcbs/publ/d457.htm"

[[sources]]
key = "boudt2008"
kind = "paper"
citation = "Boudt, K., Peterson, B. and Croux, C. (2008). Estimation and decomposition of downside risk for portfolios with non-normal returns. The Journal of Risk, 11(2), 79-103. Modified VaR (Cornish-Fisher) and modified ES (Edgeworth); synthetic inputs, the quantile in 50-digit decimals and the ES by SciPy quadrature of the Edgeworth density."
doi = "10.21314/JOR.2008.188"

[[sources]]
key = "hyndman1996"
kind = "paper"
citation = "Hyndman, R. J. and Fan, Y. (1996). Sample quantiles in statistical packages. The American Statistician, 50(4), 361-365. Definition 7 (linear interpolation) and the lower order statistic; synthetic returns, exact arithmetic."
doi = "10.1080/00031305.1996.10473566"

[[sources]]
key = "riskmetrics1996"
kind = "textbook"
citation = "J.P. Morgan and Reuters (1996). RiskMetrics Technical Document, 4th ed. Morgan Guaranty Trust Company. The recursive EWMA variance of 20 USD/DEM returns with decay 0.94, seeded with the first squared return; the forecast volatility is printed as 0.473 percent."
url = "https://www.msci.com/documents/10199/5915b101-4206-4ba0-aee2-3449d5c7e95a"
published_digits = 5

[[sources]]
key = "glasserman2003"
kind = "identity"
citation = "A seeded Monte Carlo estimate agrees with the normal identity within four of its standard errors (sqrt(c(1 - c) / N) / f(q), Glasserman 2003, section 9.1); one million draws."

