[[cases]]
id = "cornish_fisher_fat_left_tail"
source = "boudt2008"
locator = "Section 2: modified VaR and modified ES"
edge = false
inputs = { calculation = "cornish_fisher", volatility = 0.01, skewness = -0.5, excess_kurtosis = 2.0, confidence = 0.99 }
expected = { value_at_risk = 0.03067496763759961628905, expected_shortfall = 0.034531920831199256, quantile = 3.067496763759961628905 }
tolerance = { expected_shortfall = { rel = 1e-12 } }
note = "The ES is a quadrature, good to about 1e-15 absolute in the tail mean."

[[cases]]
id = "historical_linear"
source = "hyndman1996"
locator = "Section 2, definition 7: Q(p) = x_(j) + g (x_(j+1) - x_(j)), with (n - 1) p + 1 = j + g"
edge = false
inputs = { calculation = "historical", returns = [0.03, -0.01, 0.05, -0.05, 0.0, 0.02, -0.03, 0.04, -0.02, 0.01], confidence = 0.9 }
expected = { value_at_risk = 0.032, expected_shortfall = 0.05, tail_observations = 1 }
note = "p = 0.1, n = 10: j = 1, g = 0.9, so the quantile is -0.05 + 0.9 (0.02)."

[[cases]]
id = "historical_lower_order_statistic"
source = "hyndman1996"
locator = "Section 2, the inverse of the empirical distribution function"
edge = false
inputs = { calculation = "historical", returns = [0.03, -0.01, 0.05, -0.05, 0.0, 0.02, -0.03, 0.04, -0.02, 0.01], confidence = 0.8, interpolation = "lower" }
expected = { value_at_risk = 0.03, expected_shortfall = 0.04, tail_observations = 2 }
note = "NumPy's lower method at p = 0.2: index floor(0.2 x 9) = 1, the second smallest return."

[[cases]]
id = "historical_smallest_sample"
source = "hyndman1996"
locator = "Section 2, definition 7"
edge = true
inputs = { calculation = "historical", returns = [-0.04, 0.02], confidence = 0.75, horizon = 4 }
expected = { value_at_risk = 0.05, expected_shortfall = 0.08 }
note = "Quantile -0.04 + 0.25 (0.06) = -0.025, scaled by sqrt(4); the tail is -0.04 alone."

