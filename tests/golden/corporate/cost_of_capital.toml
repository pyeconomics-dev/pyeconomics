# tests/golden/corporate/cost_of_capital.toml
model = "corporate.cost_of_capital"

[[sources]]
key = "formula"
kind = "identity"
citation = "CAPM, capital-weighted WACC, Hamada and volatility-scaled spread identities; rational arithmetic."

[[cases]]
id = "capm"
source = "formula"
locator = "Closed-form identity"
edge = false
inputs = { calculation = "capm", risk_free_rate = 0.03, equity_risk_premium = 0.05, beta = 1.2 }
expected = { cost_of_equity = 0.09 }

[[cases]]
id = "wacc"
source = "formula"
locator = "Closed-form identity"
edge = false
inputs = { calculation = "wacc", equity = 600, debt = 400, cost_of_equity = 0.12, cost_of_debt = 0.06, tax_rate = 0.25 }
expected = { wacc = 0.09 }

