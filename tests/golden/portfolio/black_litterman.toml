# tests/golden/portfolio/black_litterman.toml
model = "portfolio.black_litterman"

[[sources]]
key = "hl2002"
kind = "paper"
citation = "He, G. and Litterman, R. (2002). The Intuition Behind Black-Litterman Model Portfolios. SSRN working paper 334304 (Goldman Sachs Investment Management Research, 1999). Seven equity markets, delta = 2.5, tau = 0.05, omega = tau p Sigma p' (the 1999 version's footnote 6); posterior returns from eq. (8), weights (delta (Sigma + M))^-1 mu from eq. (13), printed in percent to one decimal."
doi = "10.2139/ssrn.334304"

[[sources]]
key = "idzorek2005"
kind = "paper"
citation = "Idzorek, T. M. (2005). A Step-by-Step Guide to the Black-Litterman Model: Incorporating User-Specified Confidence Levels. Ibbotson Associates working paper (26 April 2005), in Forecasting Expected Returns in the Financial Markets (2007), ch. 2. Eight asset classes, tau = 0.025, lambda = 0.03 / (w' Sigma w), weights (lambda Sigma)^-1 E[R] (formula 2), printed in percent to two decimals."
doi = "10.1016/B978-075068321-0.50003-0"

[[sources]]
key = "identity"
kind = "identity"
citation = "With no views the posterior returns are Pi = delta Sigma w, the posterior covariance is (1 + tau) Sigma, the weights (delta Sigma)^-1 Pi are w, and He and Litterman's are w / (1 + tau)."

