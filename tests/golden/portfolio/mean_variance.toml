# tests/golden/portfolio/mean_variance.toml
model = "portfolio.mean_variance"

[[sources]]
key = "markowitz"
kind = "paper"
citation = "Markowitz, H. (1952). Portfolio selection. The Journal of Finance, 7(1), 77-91. Portfolio mean and variance formulas, applied to synthetic two-asset inputs and recomputed with exact rational arithmetic."
doi = "10.1111/j.1540-6261.1952.tb01525.x"

[[sources]]
key = "merton1972"
kind = "paper"
citation = "Merton, R. C. (1972). An analytic derivation of the efficient portfolio frontier. Journal of Financial and Quantitative Analysis, 7(4), 1851-1872. Closed forms applied to synthetic inputs; the linear systems solved exactly in rational arithmetic, roots to 40 digits."
doi = "10.2307/2329621"

[[sources]]
key = "identity"
kind = "identity"
citation = "With two assets every fully invested portfolio is on the frontier, so the frontier passes through each asset; with uncorrelated assets the tangency weights are proportional to excess return over variance. Synthetic inputs, exact rational arithmetic."

[[cases]]
id = "two_asset_portfolio"
source = "markowitz"
locator = "p. 81, the expected return E and variance V of a portfolio"
edge = false
inputs = { calculation = "portfolio", weights = [0.6, 0.4], expected_returns = [0.1, 0.06], volatilities = [0.2, 0.1], correlations = [[1.0, 0.3], [0.3, 1.0]] }
expected = { expected_return = 0.084, variance = 0.01888, volatility = 0.13740451229854134, weight_sum = 1.0 }

[[cases]]
id = "two_asset_minimum_variance"
source = "merton1972"
locator = "Eqs. (13)-(14), the minimum-variance portfolio (MIT working paper 493-70 numbering)"
edge = false
inputs = { calculation = "minimum_variance", expected_returns = [0.1, 0.06], covariance = [[0.04, 0.006], [0.006, 0.01]] }
expected = { weights = [0.10526315789473684, 0.8947368421052632], expected_return = 0.06421052631578947, variance = 0.009578947368421053, volatility = 0.09787209698591857 }
note = "Weights 2/19 and 17/19, variance 91/9500."

