# tests/golden/equity/implied_risk_premium.toml
model = "equity.implied_risk_premium"

[[sources]]
key = "damodaran_2026"
kind = "paper"
citation = "Damodaran, A. (2026). Equity Risk Premiums (ERP): Determinants, Estimation, and Implications - The 2026 Edition, updated 5 March 2026, SSRN working paper; the implied premium at the start of 2026, Figure 11, p. 103 (S&P 500 6845.50, growth 10.50% for five years, T-bond rate 4.18%, ERP 4.23%), and its companion spreadsheet ERPJan26.xlsx, sheet 'Impl premium calculator', accessed 2026-10-19. Aggregates shown with credit to Aswath Damodaran."
doi = "10.2139/ssrn.6361419"

[[sources]]
key = "damodaran_january_sheets"
kind = "paper"
citation = "Damodaran, A. Implied equity risk premium spreadsheets for the start of each year (ERPJan18.xls, ERPJan19.xlsx, ERPJan20.xlsx), the companions of the annual editions of his equity risk premium paper, Damodaran Online, accessed 2026-10-19: the index level, the trailing dividends and buybacks, the top-down growth and the T-bond rate, and the premium his goal seek solves for. Aggregates shown with credit to Aswath Damodaran."
url = "https://pages.stern.nyu.edu/~adamodar/pc/implprem/"

[[sources]]
key = "no_growth_years"
kind = "identity"
citation = "With no growth years, P = C0 (1 + gT) / (r - gT), so r = gT + C0 (1 + gT) / P: a cash yield near zero puts the implied return just above the terminal growth rate."

[[cases]]
id = "start_of_2018"
source = "damodaran_january_sheets"
locator = "ERPJan18.xls: S&P 500 2673.61, dividends plus buybacks 108.27625104837036, growth 0.07049356754097369, T-bond 0.0241; implied premium (cell C39) 0.050791854275975136"
edge = false
inputs = { index_level = 2673.61, cash_flow = 108.27625104837036, growth = 0.07049356754097369, risk_free = 0.0241 }
expected = { equity_risk_premium = 0.050791854275975136 }
tolerance = { equity_risk_premium = { abs = 1e-9 } }
note = "The sheet's premium is a goal-seek constant: it leaves the present value within about 1e-6 of the index, so the premium agrees to about 1e-11 here and 1e-9 is the tolerance for every sheet."

