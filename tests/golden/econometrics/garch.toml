# tests/golden/econometrics/garch.toml
# Identities recomputed with mpmath at 50 digits, and seeded simulations whose
# generating parameters the estimates must recover within about three standard
# errors. No dataset: the returns are an alternating sequence or simulated.
model = "econometrics.garch"

[[sources]]
key = "recursion"
kind = "identity"
citation = "The GARCH and GJR-GARCH variance recursions evaluated at fixed parameters, started from arch's backcast (the 0.94-weighted mean of the first min(75, n) squared residuals for every pre-sample squared shock and variance, half of it for a pre-sample negative-shock term), on returns alternating +0.01 and -0.01 with a zero mean: the conditional variances, the Gaussian log-likelihood and the h-step forecasts bar(sigma)^2 + pi^(h-1) (f1 - bar(sigma)^2), with pi = alpha + gamma / 2 + beta and bar(sigma)^2 = omega / (1 - pi), recomputed with mpmath at 50 digits."

[[sources]]
key = "bollerslev1986"
kind = "paper"
citation = "Bollerslev, T. (1986). Generalized autoregressive conditional heteroskedasticity. Journal of Econometrics, 31(3), 307-327. The GARCH(1, 1) process simulated for 2,500 periods with NumPy's default_rng(20261020) standard normal shocks, mu 0.0005, omega 1e-6, alpha 0.08 and beta 0.90, the first 500 dropped and the rest rounded to 8 decimals; the estimates must lie within about three standard errors (beta's, 0.025) of the generating parameters."
doi = "10.1016/0304-4076(86)90063-1"

[[sources]]
key = "nelson1991"
kind = "paper"
citation = "Nelson, D. B. (1991). Conditional heteroskedasticity in asset returns: A new approach. Econometrica, 59(2), 347-370. The EGARCH(1, 1, 1) process in arch's form (|z| centred by sqrt(2/pi)) simulated for 2,500 periods with NumPy's default_rng(20261021) standard normal shocks, omega 0.03 ln(1e-4), alpha 0.12, gamma -0.08 and beta 0.97, the first 500 dropped and the rest rounded to 8 decimals; the estimates must lie within about three standard errors (omega's, 0.07) of the generating parameters."
doi = "10.2307/2938260"

