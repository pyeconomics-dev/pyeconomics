# tests/golden/econometrics/time_series.toml
# Closed forms, seeded simulations whose generating parameters the estimates
# must recover, and MacKinnon's published response surface. No dataset: every
# series is written out here or simulated. The Lutkepohl (2005) VAR(2) table,
# recomputed on the data statsmodels ships, is in
# tests/models/econometrics/test_time_series.py, because its data cannot be
# committed.
model = "econometrics.time_series"

[[sources]]
key = "closed_form"
kind = "identity"
citation = "Gaussian maximum likelihood in closed form. White noise with a constant: the mean, the mean squared deviation sigma^2, log-likelihood -n/2 (ln(2 pi sigma^2) + 1), flat forecasts with standard error sigma and intervals mean +- z sigma. A random walk: sigma^2 the mean squared first difference over n - 1 changes, log-likelihood -(n-1)/2 (ln(2 pi sigma^2) + 1), forecasts the last value with standard error sigma sqrt(h)."

[[sources]]
key = "box2015"
kind = "textbook"
citation = "Box, G. E. P., Jenkins, G. M., Reinsel, G. C. and Ljung, G. M. (2015). Time Series Analysis: Forecasting and Control, 5th ed. Wiley. The AR(1) y_t = 0.98 y_(t-1) + e_t, e_t ~ N(0, 0.1), simulated for 1,000 periods from zero with NumPy's default_rng(20261022), the first 500 dropped and the rest rounded to 8 decimals."
isbn = "9781118675021"
recomputed_with = "the generating parameters of the seeded simulation, which the estimates must recover within three standard errors"

[[sources]]
key = "lutkepohl2005"
kind = "textbook"
citation = "Lutkepohl, H. (2005). New Introduction to Multiple Time Series Analysis. Springer. The VAR(1) y_t = A y_(t-1) + u_t with A = [[0.5, 0.1], [0.2, 0.3]] and Sigma_u = [[1, 0.3], [0.3, 0.5]], simulated for 1,000 periods from zero with NumPy's default_rng(20261023) (Gaussian shocks times the Cholesky factor), the first 500 dropped and the rest rounded to 8 decimals."
doi = "10.1007/978-3-540-27752-1"
recomputed_with = "the generating parameters of the seeded simulation, which the estimates must recover within three standard errors"

[[sources]]
key = "mackinnon2010"
kind = "paper"
citation = "MacKinnon, J. G. (2010). Critical values for cointegration tests. Queen's Economics Department Working Paper No. 1227 (the revision of MacKinnon 1991). Critical values beta_inf + beta_1/T + beta_2/T^2 + beta_3/T^3 from the response-surface coefficients, read from the paper on 2026-10-20."
url = "https://www.econ.queensu.ca/sites/econ.queensu.ca/files/wpaper/qed_wp_1227.pdf"

[[sources]]
key = "johansen1991"
kind = "paper"
citation = "Johansen, S. (1991). Estimation and hypothesis testing of cointegration vectors in Gaussian vector autoregressive models. Econometrica, 59(6), 1551-1580. Three variables, two independent random walks w1 and w2 and w1 + 0.5 w2 + an AR(1) with coefficient 0.5, 400 periods from NumPy's default_rng(20261025), rounded to 8 decimals: exactly one cointegrating relation."
doi = "10.2307/2938278"

