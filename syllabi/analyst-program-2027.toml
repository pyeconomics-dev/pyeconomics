# syllabi/analyst-program-2027.toml
# The 2027 CFA® Program's topic areas for Levels I to III, mapped to the
# launch catalog (ADR-0013 decision 12). Factual names and links to the issuing
# body only: no learning-outcome wording, reading title or exam content, and a
# neutral id. Topic names read from cfainstitute.org on the date in `checked`;
# the mapping was drafted from the topic names and each model's card and
# reviewed by the maintainer on 2026-11-02 (Phase 5 Step 7). The format is
# syllabi/schema.json; scripts/web/syllabi.py validates it.

