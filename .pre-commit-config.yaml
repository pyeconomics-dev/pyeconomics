# .pre-commit-config.yaml
# Every check a commit must pass, run by prek before every commit:
# - the quality toolchain (ROADMAP §4 1.3): file hygiene, ruff format and
#   lint, mypy, and the lock files' freshness;
# - the per-step security gate (ROADMAP §5 "Per-step security gate"):
#   secrets, SAST with the project's semgrep rules and, for web/, ESLint's
#   security rules, the dependency audits (pip-audit, and npm audit for the
#   tools/node workspace and web/) and the licence allowlists (the runtime
#   closure, and what web/ ships to browsers).
# It is fail-closed: never commit with SKIP or --no-verify. The CI workflows
# run the same hooks by id, so local and CI cannot drift.
#
# Set up once per clone:   uv sync && uv run prek install
# Run everything by hand:  uv run prek run --all-files
#
# Remote hooks are pinned to the commit SHA of the tag in their comment.
default_install_hook_types: [pre-commit]

# Generated or byte-exact files no hook may rewrite:
# - tests/fixtures/legacy and scripts/legacy: the 0.2.x characterization
#   fixtures and their recorder (manifest.json pins their SHA-256s);
# - planning/: roadmodel's kit, re-exported by its updater.
exclude: ^(tests/fixtures/legacy/|scripts/legacy/|planning/)

repos:
  # File hygiene. Markdown keeps two trailing spaces as a hard line break
  # (.editorconfig).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Format and lint: ruff, with its settings in pyproject.toml. The rev
  # matches the ruff version in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # frozen: v0.16.10
    hooks:
      - id: ruff-format
      - id: ruff-check

  # Types: mypy (strict, pydantic plugin) is the gate. It runs in the project
  # environment so it sees the locked dependencies and their stubs.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        language: system
        entry: uv run --locked mypy
        types_or: [python, pyi, toml]
        pass_filenames: false

  # Lock files: uv.lock matches pyproject.toml, and pylock.toml is a fresh
  # export of uv.lock. --no-config keeps a user-level index out (lock_index.py).
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        language: system
        entry: uv lock --check --no-config
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: pylock-fresh
        name: pylock.toml is a fresh export of uv.lock
        language: system
        entry: uv run --locked python scripts/checks/pylock_fresh.py
        files: ^(pyproject\.toml|uv\.lock|pylock\.toml|scripts/checks/pylock_fresh\.py)$
        pass_filenames: false

  # Secrets: gitleaks scans the staged changes with .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # SAST: bandit with its settings in pyproject.toml.
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # frozen: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        exclude: ^\.semgrep/tests/

  # SAST: the project's semgrep rules, and the tests that keep them honest.
  # .semgrep/tests/ holds deliberately unsafe test cases, so it is excluded.
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep (project rules)
        language: python
        additional_dependencies: [semgrep==1.179.0]
        entry: semgrep scan --config .semgrep/rules --error --metrics=off --disable-version-check --quiet
        types: [python]
        exclude: ^\.semgrep/tests/
        require_serial: true
      - id: semgrep-test
        name: semgrep --test (project rules)
        language: python
        additional_dependencies: [semgrep==1.179.0]
        entry: python scripts/checks/semgrep_tests.py
        files: ^(\.semgrep/|scripts/checks/semgrep_tests\.py$)
        pass_filenames: false

  # Dependency audit: known vulnerabilities in every package pylock.toml pins.
  - repo: https://github.com/pypa/pip-audit
    rev: 8894eb8cee033531a1fbd9f2fb160892531c14e3 # frozen: v2.10.1
    hooks:
      - id: pip-audit
        args: [--locked, --progress-spinner, "off", "."]
        always_run: true

  # Dependency audit of the Node workspace (tools/node, Phase 4 Step 7):
  # known vulnerabilities of High severity or above in its lockfile. Like
  # pip-audit it asks an advisory database, so it runs on every commit.
  - repo: local
    hooks:
      - id: npm-audit
        name: npm audit (tools/node, high and above)
        language: system
        entry: npm audit --prefix tools/node --audit-level=high
        pass_filenames: false
        always_run: true
      # The web app's own lockfile (web/, Phase 5 Step 3), the same way.
      - id: npm-audit-web
        name: npm audit (web, high and above)
        language: system
        entry: npm audit --prefix web --audit-level=high
        pass_filenames: false
        always_run: true

  # SAST of the web app (web/, Phase 5 Step 3): ESLint with
  # eslint-plugin-security, typescript-eslint and the jsx-a11y rules, no
  # warning allowed. It needs web/'s tools: run `npm ci` in web/ once.
  - repo: local
    hooks:
      - id: eslint-web
        name: eslint (web, security and accessibility)
        language: system
        entry: npm run --prefix web lint
        files: ^web/
        pass_filenames: false

  # Dependency sources and licences.
  - repo: local
    hooks:
      - id: lock-index
        name: lock files name only PyPI
        language: python
        entry: python scripts/checks/lock_index.py
        files: ^(uv\.lock|pylock\.toml|scripts/checks/lock_index\.py)$
        pass_filenames: false
      - id: licences
        name: runtime licence allowlist (ADR-0004)
        language: system
        entry: uv run --locked --all-extras python scripts/checks/licences.py
        pass_filenames: false
        always_run: true
      # What the web app ships to browsers: its production tree in
      # web/package-lock.json (Phase 5 Step 3).
      - id: web-licences
        name: web licence allowlist (what ships to browsers)
        language: system
        entry: uv run --locked python scripts/checks/web_licences.py
        files: ^(web/package(-lock)?\.json|scripts/checks/web_licences\.py)$
        pass_filenames: false

  # Workflow security: zizmor fails on any finding above Low. With GH_TOKEN
  # set (CI sets it) it also runs its online audits.
  - repo: local
    hooks:
      - id: zizmor
        name: zizmor (workflow security)
        language: python
        additional_dependencies: [zizmor==1.30.1]
        entry: zizmor --min-severity medium .github/workflows
        files: ^\.github/
        pass_filenames: false

  # Workflow validity (issue #212): actionlint (MIT) checks every workflow's
  # syntax, expressions and contexts, which zizmor does not; a workflow
  # GitHub would reject at load time fails here first. prek builds it from
  # the pinned commit with Go modules checksum-verified. shellcheck and
  # pyflakes are off so a run is the same on every machine: CI runners have
  # shellcheck installed and most local machines do not.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=, -pyflakes=]

  # No direct commits to main: every change arrives by pull request.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
