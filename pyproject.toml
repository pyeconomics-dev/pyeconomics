# pyproject.toml
[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[project]
name = "pyeconomics"
version = "1.0.0a2"
description = "Open economics and finance models with typed inputs, verified outputs and reproducible results."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Nathan Ramos, CFA", email = "nathan.ramos.github@gmail.com" },
]
keywords = [
    "economics",
    "finance",
    "monetary policy",
    "macroeconomics",
    "financial models",
    "economic data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "defusedxml>=0.7.1",
    "holidays>=0.106",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "scipy>=1.18",
    "truststore>=0.10 ; sys_platform != 'emscripten'",
    "urllib3>=2.6.3",
    "xlrd>=2.0",
]

[project.urls]
Homepage = "https://github.com/pyeconomics-dev/pyeconomics"
Repository = "https://github.com/pyeconomics-dev/pyeconomics"
Issues = "https://github.com/pyeconomics-dev/pyeconomics/issues"
Changelog = "https://github.com/pyeconomics-dev/pyeconomics/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/pyeconomics-dev/pyeconomics/blob/main/docs/roadmap/ROADMAP.md"

# Model discovery (pyeconomics.core.registry): each module named here lists its
# Model objects in __all__.
[project.entry-points."pyeconomics.models"]
accounting = "pyeconomics.models.accounting"
asset_pricing = "pyeconomics.models.asset_pricing"
corporate = "pyeconomics.models.corporate"
derivatives = "pyeconomics.models.derivatives"
econometrics = "pyeconomics.models.econometrics"
equity = "pyeconomics.models.equity"
fixed_income = "pyeconomics.models.fixed_income"
foundations = "pyeconomics.models.foundations"
international = "pyeconomics.models.international"
macro = "pyeconomics.models.macro"
performance = "pyeconomics.models.performance"
portfolio = "pyeconomics.models.portfolio"
risk = "pyeconomics.models.risk"

# Data provider discovery (pyeconomics.data.registry): each module named here
# lists its DataProvider subclasses in __all__. The built-in providers register
# from Phase 3 Step 6; a third-party package adds its own the same way.
[project.entry-points."pyeconomics.providers"]
ken_french = "pyeconomics.data.providers.ken_french"
shiller = "pyeconomics.data.providers.shiller"
aqr = "pyeconomics.data.providers.aqr"
hou_xue_zhang = "pyeconomics.data.providers.hou_xue_zhang"
jkp = "pyeconomics.data.providers.jkp"
open_source_asset_pricing = "pyeconomics.data.providers.open_source_asset_pricing"
cboe = "pyeconomics.data.providers.cboe"
coin_metrics = "pyeconomics.data.providers.coin_metrics"
damodaran = "pyeconomics.data.providers.damodaran"
yfinance = "pyeconomics.data.providers.yfinance"

treasury = "pyeconomics.data.providers.treasury"
fed_board = "pyeconomics.data.providers.fed_board"
nyfed = "pyeconomics.data.providers.nyfed"
openfigi = "pyeconomics.data.providers.openfigi"
sec_edgar = "pyeconomics.data.providers.sec_edgar"
philadelphia_fed = "pyeconomics.data.providers.philadelphia_fed"
atlanta_fed = "pyeconomics.data.providers.atlanta_fed"
cleveland_fed = "pyeconomics.data.providers.cleveland_fed"
cbo = "pyeconomics.data.providers.cbo"
penn_world_table = "pyeconomics.data.providers.penn_world_table"
bis = "pyeconomics.data.providers.bis"
dbnomics = "pyeconomics.data.providers.dbnomics"
ecb = "pyeconomics.data.providers.ecb"
eurostat = "pyeconomics.data.providers.eurostat"
imf = "pyeconomics.data.providers.imf"
oecd = "pyeconomics.data.providers.oecd"
world_bank = "pyeconomics.data.providers.world_bank"
bea = "pyeconomics.data.providers.bea"
bls = "pyeconomics.data.providers.bls"
census = "pyeconomics.data.providers.census"
fred = "pyeconomics.data.providers.fred"

# ADR-0002: each extra exists from Phase 1 Step 7 as an empty list, so the
# names are stable before their contents arrive. [app] and [bloomberg] are
# added only when their packages exist (Phases 5 and 6). ADR-0011 decision 11
# adds [keyring] (Phase 3 Step 3), [sdmx] and [yfinance]; [all] includes each.
[project.optional-dependencies]
server = []
mcp = []
ai = []
econometrics = [
    "arch>=8.0 ; python_full_version < '3.15'",
    "statsmodels>=0.15.0",
]
plot = [
    "plotly>=7.1.0",
]
# The OS keyring as the last step of the key chain (ADR-0011 decision 12).
keyring = [
    "keyring>=25.7",
]
all = [
    "yfinance>=1.7",
    "sdmx1>=2.28.0",
    "keyring>=25.7",
    "plotly>=7.1.0",
    "statsmodels>=0.15.0",
    "arch>=8.0 ; python_full_version < '3.15'",
]
sdmx = [
    "sdmx1>=2.28.0",
]
yfinance = [
    "yfinance>=1.7",
]

# PEP 735 groups: development-only, never published (ADR-0002).
[dependency-groups]
test = [
    "yfinance>=1.7",
    "sdmx1>=2.28.0",
    "hypothesis>=6.170.2",
    "jsonschema>=4.26.0",
    "keyring>=25.7",
    "numpy-financial>=1.0.0",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "quantlib>=1.44",
    "rfc8785>=0.1.4",
    "statsmodels>=0.15.0",
    "sybil>=10.1.0",
    "syrupy>=6.1.1",
    "vollib>=1.0.11",
    "quantecon>=0.13.0",
    "arch>=8.0 ; python_full_version < '3.15'",
]
dev = [
    { include-group = "test" },
    "mypy>=2.4.0",
    # packaging: scripts/checks/licences.py imports it (Step 8).
    "packaging>=26.3",
    # pandas-stubs, scipy-stubs: mypy strict types pandas and SciPy, which ship
    # no py.typed (Phase 2 Step 1).
    "pandas-stubs>=3.0.5.260914",
    "prek>=0.5.6",
    "pyright>=1.1.414",
    "ruff>=0.17.1",
    "scipy-stubs>=1.18.1.1",
    "ty>=0.0.89",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20261017",
    "xlwt>=1.3",
]
docs = [
    "myst-nb>=1.4.0",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.1",
]

[tool.uv.build-backend]
module-name = "pyeconomics"

# ---------------------------------------------------------------------------
# Quality toolchain (ROADMAP Â§4 1.3). prek runs ruff and mypy on every commit
# beside the security gate (.pre-commit-config.yaml).
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88
# Excluded even when prek passes the paths explicitly:
# - .semgrep/tests: deliberately unsafe semgrep test cases;
# - scripts/legacy, tests/fixtures/legacy: the 0.2.x characterization recorder
#   and its output, byte-exact (manifest.json pins the recorder's SHA-256).
extend-exclude = [".semgrep/tests", "scripts/legacy", "tests/fixtures/legacy"]
force-exclude = true
# Neither is a package: pytest imports tests with --import-mode=importlib, and
# the checks run as scripts. Declaring them keeps INP001 for real packages.
namespace-packages = ["tests", "scripts", "docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with the formatter (ruff's formatter docs list both).
    "COM812", # trailing comma: the formatter places them
    "ISC001", # implicit string concatenation on one line: the formatter joins
    # pydocstyle offers two incompatible choices for each of these; the numpy
    # convention takes D211 (no blank line before a class docstring) and
    # D212 (summary on the first line), so its counterparts are off.
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# pytest checks with assert, test names document themselves, and expected
# values are literals.
"tests/**" = ["S101", "D", "PLR2004"]
# pyeconomics.data's Series.values is a tuple of floats, not pandas' .values.
"tests/data/**" = ["PD011"]
# The checks and the smoke test are CLIs: printing their report to
# stdout/stderr is their output.
"scripts/checks/*.py" = ["T201"]
"scripts/smoke.py" = ["T201"]
"scripts/new_model.py" = ["T201"]
# eradicate mistakes the path in these files' header comments for code.
"tests/registry/test_model_imports.py" = ["ERA001"]
"src/pyeconomics/models/foundations/returns.py" = ["ERA001"]
"tests/models/foundations/test_returns.py" = ["ERA001"]
"src/pyeconomics/models/performance/return_measurement.py" = ["ERA001"]
"tests/models/performance/test_return_measurement.py" = ["ERA001"]
# The provider hooks take arguments a subclass uses and the base class does not.
"src/pyeconomics/data/providers/base.py" = ["ARG002"]
# Capability hooks retain the base protocol parameters even when unused.
"src/pyeconomics/data/providers/_sdmx.py" = ["ARG002"]
"src/pyeconomics/data/providers/world_bank.py" = ["ARG002"]
"src/pyeconomics/data/providers/dbnomics.py" = ["ARG002"]

# Test doubles implement the transport and provider protocols, whose parameters
# they ignore, and take what a test hands them as Any.
"tests/providers/**" = ["ARG001", "ARG002", "ARG005", "ANN401"]
# The scripted providers and the catalog world are test doubles of the same kind.
"tests/data/catalog/**" = ["ARG001", "ARG002", "ARG005", "ANN401"]
# ADR-0008 names these modules; they are only ever imported as
# pyeconomics.core.random and pyeconomics.core.warnings, never top-level.
"src/pyeconomics/core/random.py" = ["A005"]
"src/pyeconomics/core/warnings.py" = ["A005"]

# The formatter runs at its defaults.
[tool.ruff.format]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]
files = ["src", "tests"]
exclude = ['^\.semgrep/tests/', '^tests/fixtures/']

# plotly (the plot extra), statsmodels (the econometrics extra), jsonschema
# (the schema tests' validator), and numpy_financial 1.0 (the Python 3.12
# oracle) ship no type information; only their own modules are left unchecked.
[[tool.mypy.overrides]]
module = ["plotly.*", "quantecon.*", "statsmodels.*", "jsonschema.*", "numpy_financial.*", "xlrd.*", "xlwt.*", "yfinance.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# pyright is for editors (strict); mypy is the gate.
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [".semgrep/tests", "tests/fixtures", "**/__pycache__"]
venvPath = "."
venv = ".venv"

# ty runs as a non-blocking check until it reaches 1.0 (Step 10's CI).
[tool.ty.environment]
python-version = "3.12"
# tests/registry holds the toy models the result and smoke tests import too;
# tests itself holds the strategies and the contract check, tests/golden the
# loader and tests/data the data layer's shared frames.
extra-paths = ["tests", "tests/data", "tests/data/bindings", "tests/data/catalog", "tests/golden", "tests/providers", "tests/registry"]

[tool.ty.src]
include = ["src", "tests"]
exclude = [".semgrep/tests", "tests/fixtures"]

# tests/registry, tests/providers and tests/data/catalog build invalid
# specifications, infos, queries and concepts and misuse the API on purpose,
# and mypy (the gate) already checks it; ty's complaints about those lines are
# noise that would keep the informational check red.
[[tool.ty.overrides]]
include = ["tests/registry/**", "tests/providers/**", "tests/data/catalog/**"]

[tool.ty.overrides.rules]
call-non-callable = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
unresolved-reference = "ignore"

[tool.pytest.ini_options]
# --import-mode=importlib imports src/pyeconomics under its own name from the
# installed (editable) distribution, so the doctests and the tests share one
# copy of the package. Benchmarks only time when asked: --benchmark-enable.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--doctest-modules",
    "--import-mode=importlib",
    "--disable-socket",
    "--benchmark-disable",
    "-m",
    "not live",
]
testpaths = ["tests", "src", "docs"]
# tests/providers/toys.py holds the toy data providers the provider tests share;
# tests/registry/toy_models.py is the toy catalog the registry tests share;
# tests/strategies.py and tests/contract.py are the input strategies and the
# contract check, tests/golden/_loader.py the golden-file loader, and
# tests/data/frame_builders.py the data layer's shared frames, and
# tests/data/catalog/catalog_support.py the catalog's synthetic series, and
# tests/data/bindings/bound_support.py the toy bound models. Only these
# directories join sys.path: the repository root must not, because a stale
# pyeconomics/ checkout there would shadow the installed package.
pythonpath = ["tests", "tests/data", "tests/data/bindings", "tests/data/catalog", "tests/golden", "tests/providers", "tests/registry"]
markers = [
    "invariant(model_id, invariant_id): a hypothesis property test of one invariant a model declares; tests/models/test_invariant_coverage.py needs one for each",
    "oracle(model_id): compares a model with an independent library; never skipped, so a missing oracle fails the suite",
    "live: runs the provider contract suite against the real API (uv run pytest -m live --force-enable-socket tests/providers); deselected by default",
]
xfail_strict = true
filterwarnings = ["error"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
branch = true
# source_pkgs, not source: source treats a directory named pyeconomics in the
# working directory (a stale 0.2.x checkout, say) as the thing to measure.
source_pkgs = ["pyeconomics"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

# The security gate runs `bandit -c pyproject.toml` (.pre-commit-config.yaml).
# .semgrep/tests holds deliberately unsafe semgrep test cases.
[tool.bandit]
exclude_dirs = [".semgrep/tests", ".venv"]

# pytest asserts are how tests check; everywhere else B101 still applies.
[tool.bandit.assert_used]
skips = ["tests/*", "*/tests/*"]
