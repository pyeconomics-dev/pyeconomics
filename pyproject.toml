# pyproject.toml
[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[project]
name = "pyeconomics"
version = "1.0.0a1.dev2"
description = "Open economics and finance models with typed inputs, verified outputs and reproducible results."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Nathan Ramos, CFA", email = "nathan.ramos.github@gmail.com" },
]
keywords = [
    "economics",
    "finance",
    "monetary policy",
    "macroeconomics",
    "financial models",
    "economic data",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "holidays>=0.106",
    "numpy>=2.4",
    "pandas>=3.0",
    "pydantic>=2.12",
    "scipy>=1.18",
]

[project.urls]
Homepage = "https://github.com/pyeconomics-dev/pyeconomics"
Repository = "https://github.com/pyeconomics-dev/pyeconomics"
Issues = "https://github.com/pyeconomics-dev/pyeconomics/issues"
Changelog = "https://github.com/pyeconomics-dev/pyeconomics/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/pyeconomics-dev/pyeconomics/blob/main/docs/roadmap/ROADMAP.md"

# Model discovery (pyeconomics.core.registry): each module named here lists its
# Model objects in __all__.
[project.entry-points."pyeconomics.models"]
accounting = "pyeconomics.models.accounting"
corporate = "pyeconomics.models.corporate"
derivatives = "pyeconomics.models.derivatives"
econometrics = "pyeconomics.models.econometrics"
equity = "pyeconomics.models.equity"
fixed_income = "pyeconomics.models.fixed_income"
foundations = "pyeconomics.models.foundations"
international = "pyeconomics.models.international"
performance = "pyeconomics.models.performance"
portfolio = "pyeconomics.models.portfolio"
risk = "pyeconomics.models.risk"

# ADR-0002: each extra exists from Phase 1 Step 7 as an empty list, so the
# names are stable before their contents arrive. [app] and [bloomberg] are
# added only when their packages exist (Phases 5 and 6).
[project.optional-dependencies]
server = []
mcp = []
ai = []
econometrics = [
    "statsmodels>=0.15.0",
]
plot = [
    "plotly>=7.1.0",
]
all = [
    "plotly>=7.1.0",
    "statsmodels>=0.15.0",
]

# PEP 735 groups: development-only, never published (ADR-0002).
[dependency-groups]
test = [
    "hypothesis>=6.168.5",
    "jsonschema>=4.26.0",
    "numpy-financial>=1.0.0",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "quantlib>=1.43",
    "rfc8785>=0.1.4",
    "statsmodels>=0.15.0",
    "sybil>=10.1.0",
    "syrupy>=6.1.1",
    "vollib>=1.0.11",
]
dev = [
    { include-group = "test" },
    "mypy>=2.4.0",
    # packaging: scripts/checks/licences.py imports it (Step 8).
    "packaging>=26.3",
    # pandas-stubs, scipy-stubs: mypy strict types pandas and SciPy, which ship
    # no py.typed (Phase 2 Step 1).
    "pandas-stubs>=3.0.5.260914",
    "prek>=0.5.5",
    "pyright>=1.1.414",
    "ruff>=0.16.10",
    "scipy-stubs>=1.18.1.1",
    "ty>=0.0.85",
]
docs = [
    "myst-nb>=1.4.0",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.1",
]

[tool.uv.build-backend]
module-name = "pyeconomics"

# ---------------------------------------------------------------------------
# Quality toolchain (ROADMAP §4 1.3). prek runs ruff and mypy on every commit
# beside the security gate (.pre-commit-config.yaml).
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88
# Excluded even when prek passes the paths explicitly:
# - .semgrep/tests: deliberately unsafe semgrep test cases;
# - scripts/legacy, tests/fixtures/legacy: the 0.2.x characterization recorder
#   and its output, byte-exact (manifest.json pins the recorder's SHA-256).
extend-exclude = [".semgrep/tests", "scripts/legacy", "tests/fixtures/legacy"]
force-exclude = true
# Neither is a package: pytest imports tests with --import-mode=importlib, and
# the checks run as scripts. Declaring them keeps INP001 for real packages.
namespace-packages = ["tests", "scripts", "docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with the formatter (ruff's formatter docs list both).
    "COM812", # trailing comma: the formatter places them
    "ISC001", # implicit string concatenation on one line: the formatter joins
    # pydocstyle offers two incompatible choices for each of these; the numpy
    # convention takes D211 (no blank line before a class docstring) and
    # D212 (summary on the first line), so its counterparts are off.
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# pytest checks with assert, test names document themselves, and expected
# values are literals.
"tests/**" = ["S101", "D", "PLR2004"]
# The checks and the smoke test are CLIs: printing their report to
# stdout/stderr is their output.
"scripts/checks/*.py" = ["T201"]
"scripts/smoke.py" = ["T201"]
"scripts/new_model.py" = ["T201"]
# eradicate mistakes the path in these files' header comments for code.
"tests/registry/test_model_imports.py" = ["ERA001"]
"src/pyeconomics/models/foundations/returns.py" = ["ERA001"]
"tests/models/foundations/test_returns.py" = ["ERA001"]
"src/pyeconomics/models/performance/return_measurement.py" = ["ERA001"]
"tests/models/performance/test_return_measurement.py" = ["ERA001"]
# ADR-0008 names these modules; they are only ever imported as
# pyeconomics.core.random and pyeconomics.core.warnings, never top-level.
"src/pyeconomics/core/random.py" = ["A005"]
"src/pyeconomics/core/warnings.py" = ["A005"]

# The formatter runs at its defaults.
[tool.ruff.format]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]
files = ["src", "tests"]
exclude = ['^\.semgrep/tests/', '^tests/fixtures/']

# plotly (the plot extra), statsmodels (the econometrics extra), jsonschema
# (the schema tests' validator), and numpy_financial 1.0 (the Python 3.12
# oracle) ship no type information; only their own modules are left unchecked.
[[tool.mypy.overrides]]
module = ["plotly.*", "statsmodels.*", "jsonschema.*", "numpy_financial.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# pyright is for editors (strict); mypy is the gate.
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = [".semgrep/tests", "tests/fixtures", "**/__pycache__"]
venvPath = "."
venv = ".venv"

# ty runs as a non-blocking check until it reaches 1.0 (Step 10's CI).
[tool.ty.environment]
python-version = "3.12"
# tests/registry holds the toy models the result and smoke tests import too;
# tests itself holds the strategies and the contract check, tests/golden the loader.
extra-paths = ["tests", "tests/golden", "tests/registry"]

[tool.ty.src]
include = ["src", "tests"]
exclude = [".semgrep/tests", "tests/fixtures"]

# tests/registry builds invalid specifications and misuses the API on purpose,
# and mypy (the gate) already checks it; ty's complaints about those lines are
# noise that would keep the informational check red.
[[tool.ty.overrides]]
include = ["tests/registry/**"]

[tool.ty.overrides.rules]
call-non-callable = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
unresolved-reference = "ignore"

[tool.pytest.ini_options]
# --import-mode=importlib imports src/pyeconomics under its own name from the
# installed (editable) distribution, so the doctests and the tests share one
# copy of the package. Benchmarks only time when asked: --benchmark-enable.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--doctest-modules",
    "--import-mode=importlib",
    "--disable-socket",
    "--benchmark-disable",
]
testpaths = ["tests", "src", "docs"]
# tests/registry/toy_models.py is the toy catalog the registry tests share;
# tests/strategies.py and tests/contract.py are the input strategies and the
# contract check, and tests/golden/_loader.py the golden-file loader. Only these
# directories join sys.path: the repository root must not, because a stale
# pyeconomics/ checkout there would shadow the installed package.
pythonpath = ["tests", "tests/golden", "tests/registry"]
markers = [
    "invariant(model_id, invariant_id): a hypothesis property test of one invariant a model declares; tests/models/test_invariant_coverage.py needs one for each",
    "oracle(model_id): compares a model with an independent library; never skipped, so a missing oracle fails the suite",
]
xfail_strict = true
filterwarnings = ["error"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
branch = true
# source_pkgs, not source: source treats a directory named pyeconomics in the
# working directory (a stale 0.2.x checkout, say) as the thing to measure.
source_pkgs = ["pyeconomics"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

# The security gate runs `bandit -c pyproject.toml` (.pre-commit-config.yaml).
# .semgrep/tests holds deliberately unsafe semgrep test cases.
[tool.bandit]
exclude_dirs = [".semgrep/tests", ".venv"]

# pytest asserts are how tests check; everywhere else B101 still applies.
[tool.bandit.assert_used]
skips = ["tests/*", "*/tests/*"]
