# scripts/checks/licence_exceptions.toml
# Reviewed exceptions to the ADR-0004 runtime licence allowlist, read by
# scripts/checks/licences.py. This file is ADR-0004's only escape hatch, and
# it starts empty.
#
# Add an entry only in a pull request that a maintainer reviews, for a runtime
# dependency whose licence metadata is outside the allowlist, missing or
# ambiguous but whose actual licence is acceptable: for example, a mislabelled
# licence verified against the package's own LICENSE file. Name the package,
# its licence exactly as licences.py reports it (an entry stops matching when
# the metadata changes, which forces a fresh review), and why it is
# acceptable. An entry never overrides an exclusion by name.
#
# [[exception]]
# package = "example-package"
# licence = "BSD License"
# reason = "Classifier only; LICENSE in the 1.2.3 sdist is BSD-3-Clause (checked by <name>, <date>)."

# Phase 2 Step 1: the runtime baseline (ADR-0008 decision 14). Each licence
# file below was read in the installed wheel's dist-info on 2026-10-09, and
# the maintainer approved every entry in that step's pull request.

[[exception]]
package = "numpy"
licence = "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0"
reason = "SPDX expression, all permissive. numpy 2.5.3 dist-info/licenses/: LICENSE.txt is BSD-3-Clause; bundled sources are pythoncapi-compat (0BSD), libdivide (Zlib), splitmix64 and highway's random-inl.h (CC0-1.0), and pcg64, sfc64 and dragon4 (MIT). The win_amd64 wheel's LICENSE.txt (like the other compiled wheels) also lists OpenBLAS (BSD-3-Clause), LAPACK (BSD-3-Clause-Open-MPI) and the GCC runtime library (GPL-3.0-or-later WITH GCC-exception-3.1, whose exception lets non-GPL programs use it). Checked by Claude Opus 5.5, 2026-10-09."

[[exception]]
package = "scipy"
licence = "BSD License"
reason = "Ambiguous classifier only. scipy 1.18.1 dist-info/LICENSE.txt (win_amd64 wheel) is BSD-3-Clause (SciPy Developers) and lists the same OpenBLAS (BSD-3-Clause), LAPACK (BSD-3-Clause-Open-MPI) and GCC runtime (GPL-3.0-or-later WITH GCC-exception-3.1) bundle as numpy; the vendored sources' licences in the wheel are Qhull (scipy/spatial/qhull_src/COPYING_QHULL.txt, permissive) and BSD-3-Clause (duccfft, DOP, uarray). Checked by Claude Opus 5.5, 2026-10-09."

[[exception]]
package = "pandas"
licence = "BSD License"
reason = "Ambiguous classifier only. pandas 3.0.6 dist-info/LICENSE is the BSD 3-Clause License (AQR Capital Management, Lambda Foundry, PyData Development Team and contributors). Checked by Claude Opus 5.5, 2026-10-09."

[[exception]]
package = "python-dateutil"
licence = "Apache Software License AND BSD License"
reason = "Ambiguous classifiers for a dual licence. python-dateutil 2.9.0.post0 dist-info/LICENSE: Apache-2.0 for contributions after 2017-12-01 and relicensed code, BSD-3-Clause for the rest; both are on the allowlist. pandas requires it. Checked by Claude Opus 5.5, 2026-10-09."

# Phase 2 Step 12: the econometrics extra (statsmodels and its closure). The
# licence file below was read in the installed wheel's dist-info on 2026-10-11;
# the maintainer approves the entry in that step's pull request.

[[exception]]
package = "patsy"
licence = "BSD License"
reason = "Ambiguous classifier only; its License field reads '2-clause BSD'. patsy 1.0.3 dist-info/licenses/LICENSE.txt is BSD-2-Clause (Patsy Developers) for the package, and PSF-2.0 for the standard-library code in patsy/compat.py; both are on the allowlist. statsmodels requires it. Checked by Claude Opus 5.5, 2026-10-11."

# Phase 3 Step 3: the keyring extra. On Linux, keyring requires SecretStorage,
# which requires cryptography, which requires cffi. The licence file below was
# read in the cffi 2.1.1 manylinux wheel's dist-info on 2026-10-14; the
# maintainer approved the entry in that step's session, recorded in its pull
# request.

[[exception]]
package = "cffi"
licence = "MIT-0"
reason = "MIT No Attribution, outside the allowlist only by name: it is MIT without the condition to keep the notice, so it grants at least what MIT does. cffi 2.1.1 dist-info/licenses/LICENSE (cp313 manylinux2014_x86_64 wheel) applies MIT-0 to all software and documentation except where a file says otherwise; the one such file, cffi/_cffi_gen_src.py (integrated from cffi-buildtool), is MIT. Reached through the keyring extra on Linux (keyring -> SecretStorage -> cryptography -> cffi), from Phase 3 Step 10 through yfinance -> curl_cffi on all operating systems, and from Phase 4 Step 8 through the mcp extra (mcp -> pyjwt[crypto] -> cryptography -> cffi) on all operating systems. Checked by Claude Opus 5.5, 2026-10-14; the mcp path checked by Claude Opus 5.5, 2026-10-25."

# Phase 3 Step 8: maintainer approved certifi in the session on 2026-10-16.
[[exception]]
package = "certifi"
licence = "MPL-2.0"
reason = "certifi 2026.7.22 dist-info/licenses/LICENSE applies MPL-2.0 to the Mozilla CA certificate bundle. The bundle is distributed unmodified with its licence preserved; requests is reached through the optional sdmx and yfinance extras; yfinance also reaches certifi through curl_cffi. Checked by GPT-6.1 Sol, 2026-10-16; maintainer approved in that session."

# Maintainer approved sdmx1's metadata exception in the 2026-10-16 session.
[[exception]]
package = "sdmx1"
licence = "Apache Software License"
reason = "sdmx1 2.27.0 dist-info/licenses/LICENSE is Apache License Version 2.0, January 2004, already on ADR-0004's allowlist. Only its classifier is ambiguous. Checked by GPT-6.1 Sol, 2026-10-16; maintainer approved in the 2026-10-16 session."

[[exception]]
package = "defusedxml"
licence = "PSFL"
reason = "defusedxml 0.7.1 wheel's LICENSE is PYTHON SOFTWARE FOUNDATION LICENSE VERSION 2, corresponding to the allowed PSF-2.0 licence; metadata uses the legacy PSFL name. Checked by GPT-6.1 Sol, 2026-10-16. Maintainer approved in session on 2026-10-16."

[[exception]]
package = "xlrd"
licence = "BSD"
reason = "xlrd 2.0.2 wheel's LICENSE covers the main library under BSD-3-Clause and earlier David Giffin/Andrew Khan work under a legacy four-clause BSD licence requiring an advertising acknowledgement and retention of that acknowledgement on redistribution. The required acknowledgement is retained in NOTICE and the provider documentation; retain it in future advertising materials mentioning the licensed software's features or use. Required for the full NY Fed ACM .xls dataset. Checked by GPT-6.1 Sol, 2026-10-16. Maintainer approved in session on 2026-10-16."

[[exception]]
package = "peewee"
licence = "<missing>"
reason = "peewee 4.5.3 wheel LICENSE is MIT; its installed distribution omits licence metadata. Checked by GPT-6.1 Sol, 2026-10-17; maintainer approved in this session."

[[exception]]
package = "multitasking"
licence = "Apache"
reason = "multitasking 0.0.13 wheel LICENSE.txt is Apache License Version 2.0; its License field abbreviates it to Apache. Checked by GPT-6.1 Sol, 2026-10-17; maintainer approved in this session."

[[exception]]
package = "protobuf"
licence = "<missing>"
reason = "protobuf 7.36.2 Windows, macOS and Linux wheel LICENSE is BSD-3-Clause; the cp315/pure-Python wheel omits metadata, while older ABI wheels label it 3-Clause BSD License. Checked by GPT-6.1 Sol, 2026-10-17; maintainer approved in this session."

# Phase 4 Step 8: the mcp extra on Windows. The licence files below were read in
# the pywin32 312 cp313 win_amd64 wheel's dist-info/licenses on 2026-10-25; the
# maintainer approved the entry in that step's session, recorded in its pull
# request.
[[exception]]
package = "pywin32"
licence = "PSF"
reason = "Metadata names only 'PSF'. pywin32 312 dist-info/licenses (cp313 win_amd64 wheel): win32/License.txt, com/License.txt and pythonwin/License.txt are BSD-3-Clause (Mark Hammond; Greg Stein and Mark Hammond); com/win32comext/mapi/src/MAPIStubLibrary/LICENSE is MIT (Microsoft); pythonwin/pywin/idle/LICENSE.txt is the PSF licence (PSF-2.0 lineage); pythonwin/Scintilla/License.txt is a permissive HPND-style licence; isapi/README.txt states copyright only. Its separate top-level adodbapi package is LGPL-2.1 (adodbapi/license.txt): neither mcp nor pyeconomics imports it, and pyeconomics never redistributes pywin32. Reached only on Windows, through the mcp extra (mcp requires pywin32 on win32). Checked by Claude Opus 5.5, 2026-10-25; maintainer approved in that session."
