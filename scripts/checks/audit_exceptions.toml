# scripts/checks/audit_exceptions.toml
# Reviewed, dated exceptions to the Node dependency audit, read by
# scripts/checks/npm_audit.py (the `npm-audit` and `npm-audit-web` hooks). This
# file is that audit's only escape hatch.
#
# Add an entry only in a pull request the maintainer has approved, and only
# for an advisory that has no patched release and that sits in build or test
# tools alone. The check enforces the rest: an entry never covers what ships
# (`npm audit --omit=dev` must be clean of it), it expires at most 45 days
# after it was added, and it fails once it matches nothing, so it is removed
# when the fix reaches the lockfile. An advisory with a patched release is
# fixed, by an upgrade or an `overrides` pin, never listed here.
#
# [[exception]]
# advisory = "GHSA-xxxx-xxxx-xxxx"      # the id `npm audit` links to
# package = "example"                   # the package it is filed against
# projects = ["tools/node", "web"]      # the lockfiles that hold it
# added = 2026-01-01                    # the day the entry was approved
# expires = 2026-01-31                  # read again by this day
# issue = 1                             # the issue that tracks the advisory
# reason = "Why it cannot be fixed yet, and why it does not reach users."

# Approved by the maintainer on 2026-11-17 (pull request #361).
[[exception]]
advisory = "GHSA-fc5q-39xc-vjpf"
package = "picomatch"
projects = ["tools/node", "web"]
added = 2026-11-17
expires = 2026-12-17
issue = 360
reason = "CVE-2026-112366: a glob pattern such as +(*a) makes picomatch backtrack exponentially. Every release is affected (<= 4.0.7) and none is patched; the fix is micromatch/picomatch#237, open since 2026-10-22. Here picomatch is a transitive dependency of build and test tools only (vite, vitest, tinyglobby, typescript-eslint, astro's tooling, the MCP Inspector), which match the project's own patterns against its own files; `npm audit --omit=dev` is clean in both projects."
