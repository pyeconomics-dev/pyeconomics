# .semgrep/rules/credential-logging.yaml
rules:
  - id: credential-logging
    languages: [python]
    severity: ERROR
    message: >-
      This logging or print call references a name that looks like a
      credential. 0.2.x leaked the FRED key exactly this way. Never log or
      print a key, token, secret, password or credential, not even at DEBUG;
      log a redacted marker instead.
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
    patterns:
      - pattern-either:
          - pattern: print(...)
          - patterns:
              # logging.info(...), logger.debug(...), self._log.error(...)
              - pattern: $LOGGER.$METHOD(...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
      - pattern-either:
          # A name or attribute, anywhere in an argument, f-string parts included.
          - patterns:
              - pattern-either:
                  - pattern: $FUNC(..., <... $NAME ...>, ...)
                  - pattern: $FUNC(..., $KW=<... $NAME ...>, ...)
                  - pattern: $FUNC(..., <... $OBJ.$NAME ...>, ...)
                  - pattern: $FUNC(..., $KW=<... $OBJ.$NAME ...>, ...)
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i)^[a-z0-9_]*(key|token|secret|password|passwd|credential)[a-z0-9_]*$
          # A revealed Secret, whatever the variable holding it is called.
          - pattern: $FUNC(..., <... $X.reveal() ...>, ...)
          - pattern: $FUNC(..., $KW=<... $X.reveal() ...>, ...)
          # A credential read by its literal name: os.environ["FRED_API_KEY"].
          - patterns:
              - pattern-either:
                  - pattern: $FUNC(..., <... $OBJ[$KEY] ...>, ...)
                  - pattern: $FUNC(..., <... os.getenv($KEY, ...) ...>, ...)
                  - pattern: $FUNC(..., <... os.environ.get($KEY, ...) ...>, ...)
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^["'][^"']*(key|token|secret|password|passwd|credential)[^"']*["']$
