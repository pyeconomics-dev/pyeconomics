# .semgrep/rules/secret-reveal.yaml
rules:
  - id: secret-reveal
    languages: [python]
    severity: ERROR
    # The key chain and the transport are the only code that may hold a key in
    # plain text (ADR-0011 decisions 12 and 13; Phase 3 Steps 3 and 4).
    paths:
      exclude:
        - src/pyeconomics/data/credentials/
        - src/pyeconomics/data/transport/
    message: >-
      Only the credential modules (src/pyeconomics/data/credentials/) and the
      transport (src/pyeconomics/data/transport/) may reveal a Secret. A
      revealed key is plain text that a log line, an exception, a manifest or
      an export can carry, which is how 0.2.x leaked the FRED key. Pass the
      Secret itself to the transport instead.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
    pattern: $X.reveal()
