# .github/dependabot.yml
# Weekly version updates for the uv lock, the workflows' actions and the
# tools/node workspace's npm lockfile (ROADMAP §5 "Security controls by layer"). Security updates are on in the repository
# settings. The prefixes keep Dependabot's pull request titles Conventional
# Commits. When a pull request changes uv.lock but not pylock.toml,
# regenerate pylock.toml on it with
#   uv export --no-config --format pylock.toml --output-file pylock.toml
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)

  # The Node tooling (Phase 4 Step 7): @hey-api/openapi-ts and typescript,
  # which generate and type-check the CI-only TypeScript client.
  - package-ecosystem: npm
    directory: "/tools/node"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
