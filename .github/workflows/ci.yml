# .github/workflows/ci.yml
# Continuous integration for pull requests and main (ROADMAP §4 1.5). The
# lint, types and lockfile jobs run the .pre-commit-config.yaml hooks by id,
# as security.yml does, so the checks a commit passes locally are the checks a
# pull request passes here. `test` is the one aggregate status check that
# branch protection requires for the whole matrix, for `pyodide`, which runs
# scripts/smoke.py against the wheel in Pyodide, for `api-fuzz` (Schemathesis
# against openapi.json) and for `clients` (the generated TypeScript and Python
# clients against a local server). ty is informational until it reaches 1.0
# and is never required. pyright is editor-only: its PyPI wrapper fetches Node
# at first run.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: File hygiene
        shell: bash
        run: |
          set -euo pipefail
          for hook in check-yaml check-toml end-of-file-fixer trailing-whitespace mixed-line-ending; do
            uv run --locked prek run "$hook" --all-files --verbose
          done
      - name: ruff format
        run: uv run --locked prek run ruff-format --all-files --verbose
      - name: ruff check
        run: uv run --locked prek run ruff-check --all-files --verbose

  types:
    name: types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: mypy
        run: uv run --locked prek run mypy --all-files --verbose

  ty:
    name: ty (informational)
    runs-on: ubuntu-latest
    # ty is pre-1.0: it reports, and never blocks or gates a merge.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: ty
        run: uv run --locked ty check

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # ADR-0010: include Python 3.15 final (2026-10-09). uv 0.13.0
        # knows its final interpreter builds; 0.12.15 only knows an RC.
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      # tests/conftest.py: derandomized, no deadline, prints the blob.
      HYPOTHESIS_PROFILE: ci
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      # `uv run pytest`, never `python -m pytest`, which puts the working
      # directory on sys.path. The coverage report prints in the log and the
      # 95% branch floor in pyproject.toml fails the job.
      - name: Run the tests with coverage
        run: uv run --locked pytest --cov
      # The overall floor above can hide a thin tree: core/ must keep 95% and
      # models/ 90% of their own statements and branches (ROADMAP §4 2.4).
      - name: Write the coverage report
        run: uv run --locked coverage json -o coverage.json
      - name: Coverage floors for core/ and models/
        run: uv run --locked python scripts/checks/coverage_floors.py coverage.json
      # The licence check skips runtime packages whose markers exclude the
      # running platform, so each OS checks its own.
      - name: Runtime licence allowlist
        run: uv run --locked prek run licences --all-files --verbose

  package:
    name: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Build the sdist and wheel
        run: uv build
      - name: Check the distributions
        run: uvx twine==7.0.0 check --strict dist/*
      # The artifacts hold only allowlisted paths and the version in
      # pyproject.toml (scripts/checks/dist_contents.py).
      - name: Check the artifact allowlist
        run: uv run --no-project python scripts/checks/dist_contents.py dist
      # The venv and the working directory are outside the checkout, so the
      # import reads the installed wheel and never the source tree.
      - name: Install the wheel in a clean venv and import it
        shell: bash
        run: |
          set -euo pipefail
          expected=$(uv version --short)
          uv venv "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          found=$("$RUNNER_TEMP/clean/bin/python" -c 'import pyeconomics; print(pyeconomics.__version__)')
          echo "installed ${found}, pyproject.toml says ${expected}"
          test "$found" = "$expected"
      # The wheel's console script, from the same clean venv: its version, and
      # one model run whose bytes must equal Result.to_json() plus one newline.
      - name: Run the console script from the clean venv
        shell: bash
        run: |
          set -euo pipefail
          expected=$(uv version --short)
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/clean/bin/pyeconomics" --version)" = "pyeconomics ${expected}"
          "$RUNNER_TEMP/clean/bin/pyeconomics" models run foundations.time_value \
            --calculation present_value --rate 0.05 --periods 10 --future-value 100 > cli-run.json
          "$RUNNER_TEMP/clean/bin/python" -c 'import pathlib, pyeconomics; inputs = {"calculation": "present_value", "rate": 0.05, "periods": 10, "future_value": 100}; expected = pyeconomics.run("foundations.time_value", inputs).to_json().encode() + b"\n"; assert pathlib.Path("cli-run.json").read_bytes() == expected, "the console script printed other bytes"'
      # ADR-0012 decision 7: a bundle the wheel's console script writes passes
      # bundle check, and its reproduce.py, run in a second fresh venv built
      # from the same wheel, reruns the result to identical bytes.
      - name: Rerun a bundle in a fresh venv built from the wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls "$PWD"/dist/*.whl)
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/pyeconomics" models run foundations.time_value \
            --calculation irr --cash-flows "[-100, 30, 40, 50]" --bundle irr.zip > /dev/null
          "$RUNNER_TEMP/clean/bin/pyeconomics" bundle check irr.zip
          uv venv "$RUNNER_TEMP/reproduce"
          uv pip install --python "$RUNNER_TEMP/reproduce/bin/python" "$wheel"
          mkdir irr
          "$RUNNER_TEMP/reproduce/bin/python" -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' irr.zip irr
          cd irr
          "$RUNNER_TEMP/reproduce/bin/python" reproduce.py --out rerun.json
          cmp rerun.json result.json
      # ADR-0012 decisions 9 and 11: without the server extra, serve exits 8;
      # with it, a non-loopback host is refused (exit 2), and a real `pyeconomics
      # serve` with spawned workers answers a run over HTTP with the bytes of
      # Result.to_json(), then shuts down cleanly on Ctrl+C.
      - name: Serve the REST API from a fresh venv built from the wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls "$PWD"/dist/*.whl)
          cd "$RUNNER_TEMP"
          status=0
          "$RUNNER_TEMP/clean/bin/pyeconomics" serve || status=$?
          test "$status" -eq 8
          uv venv "$RUNNER_TEMP/server"
          uv pip install --python "$RUNNER_TEMP/server/bin/python" "${wheel}[server]"
          status=0
          "$RUNNER_TEMP/server/bin/pyeconomics" serve --host 0.0.0.0 || status=$?
          test "$status" -eq 2
          "$RUNNER_TEMP/server/bin/pyeconomics" serve --port 8765 --workers 2 2> serve.log &
          server=$!
          for _ in $(seq 1 120); do
            curl --silent --fail http://127.0.0.1:8765/healthz > /dev/null && break
            sleep 1
          done
          curl --silent --fail --request POST \
            --data '{"calculation": "present_value", "rate": 0.05, "periods": 10, "future_value": 100}' \
            http://127.0.0.1:8765/v1/models/foundations.time_value/run > api-run.json
          kill -INT "$server"
          wait "$server"
          cat serve.log
          "$RUNNER_TEMP/server/bin/python" -c 'import pathlib, pyeconomics; inputs = {"calculation": "present_value", "rate": 0.05, "periods": 10, "future_value": 100}; expected = pyeconomics.run("foundations.time_value", inputs).to_json().encode(); assert pathlib.Path("api-run.json").read_bytes() == expected, "the API answered other bytes"'
      # scripts/smoke.py exercises the installed wheel's core and refuses to
      # run against a checkout, so it runs from a copy outside it. It runs
      # every model's examples; with no extras, econometrics.ols must raise
      # MissingOptionalDependencyError naming pyeconomics[econometrics], which
      # covers its domain, and --min-domains 11 fails a wheel that registers
      # fewer domains than the launch catalog.
      - name: Run the smoke script against the installed wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          cp scripts/smoke.py "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/clean/bin/python" smoke.py --all --min-domains 11
      # The other path of each extra: a second clean venv with the wheel and
      # its econometrics and plot extras, where --extras fails unless every
      # model that names an extra runs to outputs (ADR-0002).
      - name: Run the smoke script against the wheel with its extras
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          uv venv "$RUNNER_TEMP/extras"
          uv pip install --python "$RUNNER_TEMP/extras/bin/python" "${wheel}[econometrics,plot]"
          cd "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/extras/bin/python" smoke.py --all --min-domains 11 --extras

  pyodide:
    name: pyodide
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # ADR-0002 and ADR-0008 decision 14: the wheel installs and runs in the
      # current Pyodide with Pyodide's own builds of its dependencies. Every
      # tool is pinned exactly, and pyodide-build does not verify the
      # cross-build environment's checksum, so this job does.
      PYODIDE_VERSION: "314.0.7"
      XBUILDENV_SHA256: "682bc46d63b860cbc17af17531718dd741d0b9e68de598874280f06706f7d58d"
      PYODIDE_CLI: "pyodide-cli==0.5.0"
      PYODIDE_BUILD: "pyodide-build==0.39.1"
      # The tools' own dependencies resolve as PyPI stood on this date.
      TOOLS_EXCLUDE_NEWER: "2026-10-09T00:00:00Z"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pyodide 314.0.7 runs Python 3.14, and pyodide-build needs the same
      # minor version on the host.
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Install the Pyodide cross-build environment and a Pyodide venv
        shell: bash
        run: |
          set -euo pipefail
          pyodide() {
            uvx --python 3.14 --exclude-newer "$TOOLS_EXCLUDE_NEWER" \
              --from "$PYODIDE_CLI" --with "$PYODIDE_BUILD" pyodide "$@"
          }
          export PYODIDE_XBUILDENV_PATH="$RUNNER_TEMP/pyodide-xbuildenv"
          echo "PYODIDE_XBUILDENV_PATH=$PYODIDE_XBUILDENV_PATH" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/xbuildenv.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/xbuildenv-${PYODIDE_VERSION}.tar.gz"
          echo "${XBUILDENV_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$PYODIDE_XBUILDENV_PATH/$PYODIDE_VERSION"
          tar -xzf "$archive" -C "$PYODIDE_XBUILDENV_PATH/$PYODIDE_VERSION"
          pyodide xbuildenv install "$PYODIDE_VERSION"
          test "$(pyodide xbuildenv version)" = "$PYODIDE_VERSION"
          pyodide venv --no-periodic-update "$RUNNER_TEMP/pyodide-venv"
      # holidays is pure Python and absent from Pyodide's index. Install ONLY
      # its locked wheel from PyPI without dependencies, then resolve the
      # compiled baseline and python-dateutil exclusively in Pyodide's index.
      # pydantic-core also publishes Emscripten
      # wheels on PyPI, which would hide a floor above the version Pyodide
      # bundles.
      - name: Install the wheel with Pyodide's NumPy, SciPy, pandas and pydantic
        shell: bash
        run: |
          set -euo pipefail
          index="$PYODIDE_XBUILDENV_PATH/$PYODIDE_VERSION/xbuildenv/pyodide-root/package_index"
          holidays_version=$(uv run --no-project python -c 'import pathlib, tomllib; print(next(p["version"] for p in tomllib.loads(pathlib.Path("uv.lock").read_text())["package"] if p["name"] == "holidays"))')
          "$RUNNER_TEMP/pyodide-venv/bin/pip" install --index-url https://pypi.org/simple \
            --only-binary=:all: --no-deps "holidays==$holidays_version"
          # These pure-Python readers, and the command line's Cyclopts with the
          # parts of its closure Pyodide does not bundle (it has attrs, rich and
          # Pygments), are absent from the Pyodide package index.
          readers=$(uv run --no-project python -c 'import pathlib, tomllib; print(" ".join(p["name"] + "==" + p["version"] for p in tomllib.loads(pathlib.Path("uv.lock").read_text())["package"] if p["name"] in {"openpyxl", "et-xmlfile", "defusedxml", "xlrd", "cyclopts", "docstring-parser", "rich-rst", "markdown-it-py", "mdurl"}))')
          "$RUNNER_TEMP/pyodide-venv/bin/pip" install --index-url https://pypi.org/simple \
            --only-binary=:all: --no-deps $readers
          "$RUNNER_TEMP/pyodide-venv/bin/pip" install --index-url "file://$index" dist/*.whl
      - name: Run the smoke script in Pyodide
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pyodide-smoke"
          cp scripts/smoke.py "$RUNNER_TEMP/pyodide-smoke/"
          cd "$RUNNER_TEMP/pyodide-smoke"
          "$RUNNER_TEMP/pyodide-venv/bin/python" -c 'import numpy, pandas, pydantic, scipy; print("numpy", numpy.__version__, "scipy", scipy.__version__, "pandas", pandas.__version__, "pydantic", pydantic.VERSION)'
          "$RUNNER_TEMP/pyodide-venv/bin/python" smoke.py --min-domains 11
          "$RUNNER_TEMP/pyodide-venv/bin/python" -c 'from pyeconomics.data.transport.files import spreadsheet, workbook; assert spreadsheet(workbook({"data": ((1,),)}), "data", "smoke") == ((1,),)'
      # ADR-0012 decision 1: pyeconomics.cli imports in Pyodide without
      # Cyclopts, then builds the command line and runs it in-process.
      - name: Build the command line in Pyodide
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pyodide-smoke"
          "$RUNNER_TEMP/pyodide-venv/bin/python" -c 'import sys, pyeconomics.cli; assert "cyclopts" not in sys.modules, "importing the cli loaded Cyclopts"'
          "$RUNNER_TEMP/pyodide-venv/bin/python" -c 'import io; from pyeconomics.cli import build_app, main; from pyeconomics.cli.output import Streams; streams = lambda out: Streams(stdin=io.BytesIO(), stdout=out, stderr=io.BytesIO()); app = build_app(streams(io.BytesIO())); assert {"models", "data", "keys", "cache", "registry"} <= set(app); out = io.BytesIO(); assert main(["models", "run", "foundations.time_value", "--calculation", "present_value", "--rate", "0.05", "--periods", "10", "--future-value", "100"], streams=streams(out)) == 0; print(out.getvalue().decode()[:120])'

  docs:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - name: Build the preview and execute its notebook
        run: uv run --locked --group docs --all-extras sphinx-build -W --keep-going -b html docs docs/_build/html

  # ADR-0012 decisions 10-12: Schemathesis against openapi.json, the app run
  # in-process in local and hosted modes with spawned workers and every data
  # request answered by a recording pool. The fuzz group's Schemathesis needs
  # PyYAML, which has no CPython 3.15 wheel, so this job runs on 3.14 under the
  # Wheel rule (tests/server/test_fuzz_gap.py asserts the gap on every cell).
  api-fuzz:
    name: api-fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - name: Install the locked environment with the fuzz group
        run: uv sync --locked --group fuzz
      # A fixed seed (derandomized Hypothesis) and example budget per operation:
      # no server error; status code, content type and body as documented.
      - name: Fuzz the API in local and hosted modes
        run: uv run --locked --group fuzz pytest -m fuzz tests/server/test_api_fuzz.py -p no:cacheprovider

  # ADR-0012 decision 18: the TypeScript client (@hey-api/openapi-ts, in the
  # tools/node workspace with its lockfile) and the Python client
  # (openapi-python-client) generated from the same openapi.json, the first
  # type-checked, then one data-free run through each against a real
  # `pyeconomics serve`, whose bytes must equal Result.to_json(). Neither
  # client is committed or published in Phase 4.
  clients:
    name: clients
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
      - name: Install the locked environment with the clients group
        run: uv sync --locked --group clients
      - name: Export openapi.json
        run: uv run --locked --group clients pyeconomics registry export --out tools/node/generated
      # npm ci installs exactly the lockfile; no package may run an install script.
      - name: Install the Node tools from their lockfile
        working-directory: tools/node
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Generate and type-check the TypeScript client
        working-directory: tools/node
        run: |
          set -euo pipefail
          npx --no-install openapi-ts
          npx --no-install tsc --noEmit
          npx --no-install tsc
      # openapi-python-client names classes by schema title, which two models'
      # definitions can share: retitle each component by its unique name first.
      - name: Generate the Python client
        run: |
          set -euo pipefail
          uv run --locked --group clients python scripts/clients/retitle_openapi.py \
            tools/node/generated/openapi.json "$RUNNER_TEMP/openapi-titled.json"
          uv run --locked --group clients openapi-python-client generate \
            --path "$RUNNER_TEMP/openapi-titled.json" \
            --output-path "$RUNNER_TEMP/python-client/pyeconomics_client" \
            --meta none --fail-on-warning
      - name: Call one model through each client against a local server
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --group clients pyeconomics serve --port 8765 --workers 1 2> serve.log &
          server=$!
          for _ in $(seq 1 120); do
            curl --silent --fail http://127.0.0.1:8765/healthz > /dev/null && break
            sleep 1
          done
          (cd tools/node && node smoke.mjs http://127.0.0.1:8765 "$RUNNER_TEMP/ts-run.json")
          uv run --locked --group clients python scripts/clients/python_smoke.py \
            "$RUNNER_TEMP/python-client" http://127.0.0.1:8765 "$RUNNER_TEMP/py-run.json"
          kill -INT "$server"
          wait "$server"
          cat serve.log
          uv run --locked --group clients python scripts/clients/compare_runs.py \
            "$RUNNER_TEMP/ts-run.json" "$RUNNER_TEMP/py-run.json"

  # The MCP Inspector's CLI (tools/node, pinned) against the MCP server: over
  # stdio (pyeconomics mcp), over Streamable HTTP at a local REST server's /mcp
  # (through its worker pool), and at pyeconomics mcp --transport http. Each run
  # lists the tools and calls a data-free headline tool and run_model, whose
  # answers must be the Python API's canonical result (Phase 4 Step 8).
  mcp-inspector:
    name: mcp-inspector
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
      - name: Install the locked environment
        run: uv sync --locked
      # npm ci installs exactly the lockfile; no package may run an install script.
      - name: Install the Node tools from their lockfile
        working-directory: tools/node
        run: npm ci --ignore-scripts --no-fund --no-audit
      # The Inspector keeps its catalog in the runner's temporary directory.
      - name: Check the server over stdio
        shell: bash
        run: |
          set -euo pipefail
          export MCP_CATALOG_PATH="$RUNNER_TEMP/inspector-catalog.json"
          uv run --locked python scripts/mcp/inspector_checks.py tools/node \
            "$PWD/.venv/bin/pyeconomics" mcp
      - name: Check a local server's /mcp and the local HTTP app
        shell: bash
        run: |
          set -euo pipefail
          export MCP_CATALOG_PATH="$RUNNER_TEMP/inspector-catalog.json"
          wait_for() {
            for _ in $(seq 1 120); do
              curl --silent --output /dev/null "$1" && return 0
              sleep 1
            done
            return 1
          }
          uv run --locked pyeconomics serve --port 8765 --workers 1 2> serve.log &
          serve=$!
          wait_for http://127.0.0.1:8765/healthz
          uv run --locked python scripts/mcp/inspector_checks.py tools/node \
            http://127.0.0.1:8765/mcp
          kill -INT "$serve"
          wait "$serve"
          cat serve.log
          uv run --locked pyeconomics mcp --transport http --port 8766 2> mcp.log &
          alone=$!
          wait_for http://127.0.0.1:8766/mcp
          uv run --locked python scripts/mcp/inspector_checks.py tools/node \
            http://127.0.0.1:8766/mcp
          kill -INT "$alone"
          wait "$alone"
          cat mcp.log

  # ADR-0012 decision 3 out of process (Phase 4 Step 10): the built wheel with
  # its server and mcp extras in a clean venv, and for the first golden case of
  # each domain, the console script's output, a real `pyeconomics serve` with
  # spawned workers over HTTP and `pyeconomics mcp` over stdio must each answer
  # the Python API's canonical bytes, or its problem
  # (scripts/parity/check_installed.py). tests/parity/ asks every case in-process.
  parity:
    name: parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - name: Build the wheel
        run: uv build --wheel
      # The venv and the working directory are outside the checkout, so every
      # surface runs the installed wheel and never the source tree.
      - name: Install the wheel with its server and mcp extras in a clean venv
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls "$PWD"/dist/*.whl)
          uv venv --python 3.14 "$RUNNER_TEMP/parity"
          uv pip install --python "$RUNNER_TEMP/parity/bin/python" "${wheel}[server,mcp]"
      - name: Compare every surface with the Python API, out of process
        shell: bash
        run: |
          set -euo pipefail
          golden="$PWD/tests/golden"
          check="$PWD/scripts/parity/check_installed.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/parity/bin/python" -I "$check" "$golden" "$RUNNER_TEMP/parity/bin/pyeconomics"

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: uv.lock matches pyproject.toml
        run: uv run --locked prek run uv-lock --all-files --verbose
      - name: pylock.toml is a fresh export of uv.lock
        run: uv run --locked prek run pylock-fresh --all-files --verbose

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      # ADR-0003: the squash message is the PR title, so a Conventional
      # Commits title marks breaking changes (`!`) in review and in history.
      # The title is untrusted: it reaches the shell only through env.
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::The PR title is not a Conventional Commit: <type>(<scope>)!: <description>. Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            exit 1
          fi
          echo "Title is a Conventional Commit."

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Developer Certificate of Origin (ADR-0004): every commit carries a
      # Signed-off-by trailer naming its author (`git commit -s`).
      # Dependabot's commits cannot carry one, so a pull request GitHub
      # attributes to dependabot[bot] is exempt; the exemption reads the PR's
      # authenticated author, never a commit's free-text author field.
      - name: Check every commit carries its author's sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot pull request: exempt from the DCO check."
            exit 0
          fi
          failed=0
          for commit in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author=$(git log -1 --format='%an <%ae>' "$commit")
            if git log -1 --format=%B "$commit" | grep -Fxq "Signed-off-by: ${author}"; then
              echo "ok      ${commit:0:12} ${author}"
            else
              echo "::error::${commit:0:12} lacks 'Signed-off-by: ${author}'. Amend with git commit -s (or git rebase --signoff)."
              failed=1
            fi
          done
          exit "$failed"

  test:
    name: test
    # The single status check that branch protection requires for the whole
    # matrix and the Pyodide smoke test. ty is deliberately absent. A job
    # skipped by design (pr-title and dco on a push) passes; a failed or
    # cancelled one does not.
    if: always()
    needs: [lint, types, tests, package, pyodide, docs, api-fuzz, clients, mcp-inspector, parity, lockfile, pr-title, dco]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Every required job succeeded or was skipped by design
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
