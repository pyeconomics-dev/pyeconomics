# .github/workflows/providers-live.yml
# The weekly live provider run (ADR-0011 decision 18; ROADMAP §5 "Operations &
# observability strategy"). It runs the whole live suite (`pytest -m live`):
# every registered provider's contract cases against the real APIs, the
# ALFRED first-release proof, and the live tests later steps add beside their
# bindings and models.
#
# - Only on schedule and workflow_dispatch, never on a pull request, and only
#   from main: the providers-live environment admits main alone, and its four
#   secrets (FRED_API_KEY, BLS_API_KEY, BEA_API_KEY, CENSUS_API_KEY) are
#   environment secrets, never repository secrets (Phase 1's V10.5).
# - The secrets reach only the pytest step's environment. Egress is blocked
#   except the providers' declared hosts and what checkout, uv, PyPI and the
#   artifact upload need; tests/providers/test_live_workflows.py checks that
#   every registered provider's hosts are listed.
# - A failing run's report job (the only job with issues: write) opens one
#   issue labelled provider-live with the run's URL and the failing test ids,
#   never log text, and closes older open provider-live issues as superseded.
# - Dispatch with simulate_failure to make the alarm test fail on purpose
#   (tests/providers/test_live_alarm.py), the alarm proof of Step 20.
# providers-heartbeat.yml checks daily that this run keeps succeeding.
name: providers-live

on:
  schedule:
    # Mondays at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Make the alarm test fail, to prove the failure report
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: providers-live
  cancel-in-progress: false

jobs:
  live:
    name: live provider contract
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: providers-live
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            www.philadelphiafed.org:443
            www.atlantafed.org:443
            www.clevelandfed.org:443
            dataverse.nl:443
            objectstore.surf.nl:443
            api.stlouisfed.org:443
            api.bls.gov:443
            apps.bea.gov:443
            api.census.gov:443
            api.worldbank.org:443
            api.db.nomics.world:443
            data-api.ecb.europa.eu:443
            stats.bis.org:443
            api.imf.org:443
            sdmx.oecd.org:443
            ec.europa.eu:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Install the locked environment
        run: uv sync --locked --all-extras

      # The keys exist in this step's environment and nowhere else. pytest's
      # own output names tests, never a key: the redaction layer scrubs every
      # registered secret from logs and errors.
      - name: Run the live suite
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          PROVIDERS_LIVE_SIMULATE_FAILURE: ${{ inputs.simulate_failure && '1' || '' }}
        run: >-
          uv run --locked pytest -m live --force-enable-socket -q
          -p no:cacheprovider --junitxml=live-junit.xml

      - name: Keep the test ids
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-junit
          path: live-junit.xml
          retention-days: 30
          if-no-files-found: ignore

  report:
    name: report the failure
    needs: live
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Fetch the test ids
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: live-junit

      # Only the ids of failing tests go into the issue: no log line, which
      # could hold what a source sent back.
      - name: Open one issue and close the older ones
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'EOF' > failing.txt
          import pathlib
          import xml.etree.ElementTree as ElementTree

          path = pathlib.Path("live-junit.xml")
          ids = []
          if path.is_file():
              for case in ElementTree.parse(path).iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      ids.append(f"{case.get('classname', '')}::{case.get('name', '')}")
          print("\n".join(f"- `{test_id}`" for test_id in ids[:100]) or "- (no test ids: the run failed before or outside the tests)")
          EOF
          {
            echo "The weekly live provider run failed: ${RUN_URL}"
            echo
            echo "Failing tests:"
            echo
            cat failing.txt
            echo
            echo "Read the run's log for detail. Older open provider-live issues are closed as superseded."
          } > body.md
          old=$(gh issue list --label provider-live --state open --json number --jq '.[].number')
          new=$(gh issue create --label provider-live \
            --title "providers-live failed ($(date -u +%Y-%m-%d))" --body-file body.md)
          for number in $old; do
            gh issue close "$number" --reason "not planned" --comment "Superseded by ${new}."
          done
