# .github/workflows/scorecard.yml
# OpenSSF Scorecard (ROADMAP §4 1.4): publishes the repository's supply-chain
# score and uploads the findings to code scanning. Publishing restricts this
# workflow to the actions below, with no top-level env or defaults.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish the results to the OpenSSF API and badge
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
