# .github/workflows/scorecard.yml
# OpenSSF Scorecard (ROADMAP §4 1.4): publishes the repository's supply-chain
# score and uploads the findings to code scanning. Publishing restricts this
# workflow to the actions below, with no top-level env or defaults.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish the results to the OpenSSF API and badge
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
          category: scorecard
