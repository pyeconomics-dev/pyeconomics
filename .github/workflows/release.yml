# .github/workflows/release.yml
#
# Release pipeline for the 1.x line, through PyPI Trusted Publishing (OIDC):
# no stored credential can publish. A `v*` tag on main is verified, built
# once, checked, and published with PEP 740 attestations: a `.devN` version to
# TestPyPI through the `testpypi` environment, any other version to PyPI
# through the `pypi` environment, which waits for the maintainer's approval.
# It releases two distributions at one version (ADR-0002; ADR-0013 decisions
# 16 and 18): pyeconomics (wheel and sdist) and pyeconomics-app, the wheel of
# the built web app that `pyeconomics serve` serves. The build job builds the
# site once, for the app flavour, packages it into packages/pyeconomics-app,
# builds and checks each distribution against its own allowlist, and each
# publish job uploads all three files through one OIDC exchange: both projects
# name the same trusted publisher (this workflow and environment), so the one
# token covers both. release-smoke.yml then installs the exact version, with
# its app, from the index it went to, in a fresh venv. The 0.2.x line releases
# through its own workflow on legacy/0.2.x; this one refuses `v0.*` tags.
# ci.yml is not repeated here: a tag must be on main, and main's required
# checks have passed on that commit.

name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      index: ${{ steps.version.outputs.index }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Check the tag is on main and equals the project version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == v0.* ]]; then
            echo "::error::${TAG} is a 0.x tag: 0.2.x releases through legacy/0.2.x's own workflow."
            exit 1
          fi
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::${TAG} (${commit}) is not on main."
            exit 1
          fi
          version=$(uv version --short)
          if ! [[ "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "::error::pyproject.toml holds '${version}', not a 1.x release version."
            exit 1
          fi
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::Tag ${TAG} does not match the project version (${version})."
            exit 1
          fi
          if [[ "$version" =~ \.dev[0-9]+$ ]]; then index=testpypi; else index=pypi; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "index=${index}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} from ${commit} to ${index}."

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false

      # No package cache in a release: a poisoned cache must not reach what is
      # published (zizmor cache-poisoning); npm ci reads the registry.
      - name: Set up Node.js from web/.nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      # The web app, built once (ADR-0013 decision 18): its tools from the
      # lockfile with no install script, the site data exported from the locked
      # environment with every extra, and the build for the app flavour, which
      # is never indexed and carries no analytics (decision 16).
      - name: Build the site for the app wheel
        working-directory: web
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          GIT_SHA: ${{ github.sha }}
          SITE_FLAVOUR: app
          UV_PYTHON: "3.14"
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run data
          npm run build

      - name: Scan the built site for secrets with gitleaks
        run: |
          set -euo pipefail
          gitleaks_image="ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$gitleaks_image" \
            dir web/dist --config .gitleaks.toml --redact --no-banner --exit-code 1

      # pyeconomics's sdist and wheel into dist/, and, once the site is copied
      # into its package (scripts/web/package_site.py), pyeconomics-app's wheel
      # into dist-app/, so each allowlist reads its own distribution.
      - name: Build the distributions
        run: |
          set -euo pipefail
          uv run --no-project python scripts/web/package_site.py
          uv build
          uv build --package pyeconomics-app --wheel --out-dir dist-app

      - name: Check the distributions
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          uvx twine==7.0.0 check --strict dist/* dist-app/*
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Expected one wheel and one sdist in dist/."
            exit 1
          fi
          wheel_version=$(unzip -p "${wheels[0]}" '*.dist-info/METADATA' | sed -n 's/^Version: //p')
          sdist_version=$(tar -xzOf "${sdists[0]}" --wildcards '*/PKG-INFO' | sed -n 's/^Version: //p' | head -n 1)
          if [ "$wheel_version" != "$VERSION" ] || [ "$sdist_version" != "$VERSION" ]; then
            echo "::error::Built ${wheel_version} (wheel) and ${sdist_version} (sdist), expected ${VERSION}."
            exit 1
          fi
          uv run --no-project python scripts/checks/dist_contents.py dist
          uv run --no-project python scripts/checks/app_contents.py dist-app
          mkdir upload
          cp dist/*.whl dist/*.tar.gz dist-app/*.whl upload/
          sha256sum upload/*

      # One artifact with all three files, which each publish job uploads
      # together.
      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: upload/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    needs: [verify, build]
    if: needs.verify.outputs.index == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pyeconomics/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Both projects' files through one OIDC exchange, each with its
      # attestation; pyeconomics-app's first upload creates the project from
      # its pending publisher.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: publish to PyPI
    needs: [verify, build]
    if: needs.verify.outputs.index == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyeconomics/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Both projects' files through one OIDC exchange, each with its
      # attestation.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  smoke:
    name: smoke test the published release
    needs: [verify, publish-testpypi, publish-pypi]
    if: >-
      !cancelled()
      && (needs.publish-testpypi.result == 'success'
          || needs.publish-pypi.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      index: ${{ needs.verify.outputs.index }}
