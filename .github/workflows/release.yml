# .github/workflows/release.yml
#
# Release pipeline for the 0.2.x line, through PyPI Trusted Publishing
# (OIDC): no stored credential can publish. A `v0.2.*` tag on legacy/0.2.x
# is verified, tested, built once, checked, and published with attestations:
# a `.devN` version to TestPyPI through the `testpypi` environment, any
# other version to PyPI through the `pypi` environment, which waits for the
# maintainer's approval. A smoke job then installs the exact version from
# the index it went to, in a fresh venv, and runs the credential check.

name: release

on:
  push:
    tags: ['v0.2.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      index: ${{ steps.version.outputs.index }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on legacy/0.2.x and matches __version__.py
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/legacy/0.2.x; then
            echo "::error::${TAG} (${commit}) is not on legacy/0.2.x."
            exit 1
          fi
          version=$(sed -n "s/^__version__ = ['\"]\([^'\"]*\)['\"]\$/\1/p" __version__.py)
          if ! [[ "$version" =~ ^0\.2\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "::error::__version__.py holds '${version}', not a 0.2.x release version."
            exit 1
          fi
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::Tag ${TAG} does not match __version__.py (${version})."
            exit 1
          fi
          if [[ "$version" =~ \.dev[0-9]+$ ]]; then index=testpypi; else index=pypi; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "index=${index}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} from ${commit} to ${index}."

  test:
    name: test
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build:
    name: build
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false

      - name: Build the sdist and wheel
        run: uv build

      - name: Check the distributions
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          uvx twine==7.0.0 check --strict dist/*
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Expected one wheel and one sdist in dist/."
            exit 1
          fi
          wheel_version=$(unzip -p "${wheels[0]}" '*.dist-info/METADATA' | sed -n 's/^Version: //p')
          sdist_version=$(tar -xzOf "${sdists[0]}" --wildcards '*/PKG-INFO' | sed -n 's/^Version: //p' | head -n 1)
          if [ "$wheel_version" != "$VERSION" ] || [ "$sdist_version" != "$VERSION" ]; then
            echo "::error::Built ${wheel_version} (wheel) and ${sdist_version} (sdist), expected ${VERSION}."
            exit 1
          fi
          sha256sum dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    needs: [verify, build]
    if: needs.verify.outputs.index == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pyeconomics/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: publish to PyPI
    needs: [verify, build]
    if: needs.verify.outputs.index == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyeconomics/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  smoke:
    name: smoke test the published release
    needs: [verify, publish-testpypi, publish-pypi]
    if: >-
      !cancelled()
      && (needs.publish-testpypi.result == 'success'
          || needs.publish-pypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      INDEX: ${{ needs.verify.outputs.index }}
      MPLBACKEND: Agg

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The venv lives outside the checkout, so the credential check imports
      # the published package and never the source tree.
      - name: Install the published version in a fresh venv
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke"
          py="$RUNNER_TEMP/smoke/bin/python"
          if [ "$INDEX" = testpypi ]; then
            index_url=https://test.pypi.org/simple/
          else
            index_url=https://pypi.org/simple/
          fi
          # The package alone from the index it was published to, retrying
          # while the index propagates. Never an extra index: TestPyPI must
          # not resolve a third-party name.
          for attempt in $(seq 1 10); do
            if "$py" -m pip install --no-cache-dir --no-deps \
                --index-url "$index_url" "pyeconomics==${VERSION}"; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::pyeconomics==${VERSION} did not install from ${index_url}."
              exit 1
            fi
            sleep 30
          done
          # Its dependencies from PyPI only, read from the installed metadata.
          "$py" -c 'import importlib.metadata as m; print("\n".join(m.requires("pyeconomics") or []))' > "$RUNNER_TEMP/requires.txt"
          "$py" -m pip install --no-cache-dir \
              --index-url https://pypi.org/simple/ -r "$RUNNER_TEMP/requires.txt"
          "$py" -m pip check

      - name: Check the installed version
        run: |
          "$RUNNER_TEMP/smoke/bin/python" - <<'EOF'
          import importlib.metadata
          import os
          import sys

          installed = importlib.metadata.version("pyeconomics")
          expected = os.environ["VERSION"]
          print(f"installed {installed}, tagged {expected}")
          sys.exit(installed != expected)
          EOF

      - name: Check that no credential is logged
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/scripts/check_credential_logging.py"
