# .github/workflows/zap-baseline.yml
#
# The OWASP ZAP baseline scan of a deployed site (Phase 5 Step 20; ROADMAP §4
# 5.9 and §5 Phase 5's security criterion; ADR-0013 decision 19): ZAP's spider
# and passive rules over every page it reaches, never an active attack.
#
# - Only on workflow_dispatch from main, naming the deployment to scan. Each
#   target has its own job in its own environment: `staging` (main only) or
#   `production` (main and v* tags, the maintainer's approval). Neither runs on
#   a pull request or a schedule.
# - Until the cutover (Phase 5 Step 21) both hosts sit behind Cloudflare Access.
#   The job reads that environment's Access service token, CF_ACCESS_CLIENT_ID
#   and CF_ACCESS_CLIENT_SECRET (Phase 3 check 78 and Phase 4 check 64 admit
#   those two names for this workflow, in these two environments alone), and
#   writes them into a ZAP options file that adds the two headers through ZAP's
#   replacer, only on requests to the scanned host. The file is never echoed,
#   is mounted into ZAP's container with the workspace, and is deleted after the
#   scan; the action uploads only its three reports. After the cutover no Access
#   header is needed: production's job passes none once the environment's
#   PRODUCTION_PUBLIC is true, and the replacer then adds nothing.
# - ZAP runs with -silent: it checks for no update and installs no add-on, so it
#   reaches only the scanned host. The image is pinned by digest.
# - fail_action is on, so any alert the rules file does not record fails the job,
#   and allow_issue_writing is off, so it opens no issue. `.zap/rules.tsv`
#   records each false positive or accepted finding with its reason. A last step
#   fails on any High alert whatever the rules file says: a High is a FAIL at the
#   readiness gate, and is never recorded away.

name: zap-baseline

on:
  workflow_dispatch:
    inputs:
      target:
        description: The deployment to scan
        required: true
        type: choice
        options:
          - staging
          - production

permissions: {}

concurrency:
  group: zap-baseline-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  staging:
    name: ZAP baseline of staging
    if: github.ref == 'refs/heads/main' && inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
    permissions:
      contents: read
    steps:
      # Audit, as the deploy workflows: ZAP's container shares the runner's
      # network (the action runs it with --network=host).
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out the rules file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write ZAP's Access header rules
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SCAN_HOST: staging.pyeconomics.dev
        run: python3 scripts/zap/access_props.py access.props

      - name: Scan staging
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://staging.pyeconomics.dev/
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          rules_file_name: .zap/rules.tsv
          cmd_options: -z "-silent -configfile /zap/wrk/access.props"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-staging

      - name: Delete the header rules
        if: always()
        run: rm -f access.props

      - name: Refuse any High alert
        if: always()
        run: python3 scripts/zap/no_high.py report_json.json

  production:
    name: ZAP baseline of production
    if: github.ref == 'refs/heads/main' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
    steps:
      # Audit, as the deploy workflows: ZAP's container shares the runner's
      # network (the action runs it with --network=host).
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out the rules file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Once production is public (the environment's PRODUCTION_PUBLIC, set at the
      # cutover, Phase 5 Step 21) the scan sends no Access header: it sees exactly
      # what anyone sees. The deploy keeps the secrets, for an Access rollback.
      - name: Write ZAP's Access header rules
        env:
          CF_ACCESS_CLIENT_ID: ${{ vars.PRODUCTION_PUBLIC != 'true' && secrets.CF_ACCESS_CLIENT_ID || '' }}
          CF_ACCESS_CLIENT_SECRET: ${{ vars.PRODUCTION_PUBLIC != 'true' && secrets.CF_ACCESS_CLIENT_SECRET || '' }}
          SCAN_HOST: pyeconomics.dev
        run: python3 scripts/zap/access_props.py access.props

      - name: Scan production
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://pyeconomics.dev/
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          rules_file_name: .zap/rules.tsv
          cmd_options: -z "-silent -configfile /zap/wrk/access.props"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-production

      - name: Delete the header rules
        if: always()
        run: rm -f access.props

      - name: Refuse any High alert
        if: always()
        run: python3 scripts/zap/no_high.py report_json.json
