# .github/workflows/security.yml
# The per-step security gate in CI (ROADMAP §5 "Per-step security gate"). The
# gate-* jobs run the .pre-commit-config.yaml hooks by id, so the checks a
# commit passes locally are the checks a pull request passes here; trufflehog,
# zizmor and dependency review add what a local hook cannot see. Every job
# is a required status check on main. --verbose prints each hook's output,
# so the log shows what was scanned.
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate-secrets:
    name: gate-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false
      # The gitleaks hook scans staged changes. An orphan branch stages every
      # tracked file, so the same hook scans the whole tree here.
      - name: Stage the whole tree
        run: git checkout --orphan gate-secrets-scan
      - name: gitleaks
        run: uv run --locked prek run gitleaks --all-files --verbose

  gate-sast:
    name: gate-sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false
      - name: bandit
        run: uv run --locked prek run bandit --all-files --verbose
      - name: semgrep
        run: uv run --locked prek run semgrep --all-files --verbose
      - name: semgrep --test
        run: uv run --locked prek run semgrep-test --all-files --verbose

  gate-deps:
    name: gate-deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false
      - name: pip-audit
        run: uv run --locked prek run pip-audit --all-files --verbose
      - name: lock files name only PyPI
        run: uv run --locked prek run lock-index --all-files --verbose
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
      # tools/node's lockfile (Phase 4 Step 7); npm audit reads it, installs nothing.
      - name: npm audit
        run: uv run --locked prek run npm-audit --all-files --verbose
      # web/'s lockfile (Phase 5 Step 3), the same way.
      - name: npm audit (web)
        run: uv run --locked prek run npm-audit-web --all-files --verbose

  gate-licences:
    name: gate-licences
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false
      - name: runtime licence allowlist
        run: uv run --locked prek run licences --all-files --verbose
      # What web/ ships to browsers, read from its lockfile (Phase 5 Step 3);
      # ci.yml's web job also checks the built bundle's packages.
      - name: web licence allowlist
        run: uv run --locked prek run web-licences --all-files --verbose

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Scans the pull request's commits, or the pushed commits, for verified
      # and unverifiable credentials.
      - uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          version: 3.99.0
          extra_args: --results=verified,unknown

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false
      # The token lets zizmor run its online audits (impostor commits,
      # known-vulnerable actions); it fails on any finding above Low.
      - name: zizmor
        run: uv run --locked prek run zizmor --all-files --verbose
        env:
          GH_TOKEN: ${{ github.token }}
      # Workflow validity (#212): the job keeps zizmor's name, the required
      # check, and also runs actionlint (prek fetches the Go toolchain that
      # builds it).
      - name: actionlint
        run: uv run --locked prek run actionlint --all-files --verbose

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # ADR-0004's allowlist.
          # defusedxml: PSFL metadata, bundled PSF Version 2; maintainer approved
          # 2026-10-16. et-xmlfile: MIT, with permissive Python-derived code.
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, NCSA, PSF-2.0
          # Development tools, never distributed or linked (ADR-0004 keeps
          # them outside the allowlist; the licences hook checks the real
          # runtime closure):
          # - trufflehog's action is AGPL-3.0;
          # - GitHub's dependency graph files uv.lock's dependency groups
          #   under runtime scope, so dev and test packages land here too:
          #   hypothesis (test group) and pathspec (mypy's) are MPL-2.0.
          # - typing-extensions is misread: its License-Expression is PSF-2.0
          #   (allowed), but GitHub's scan of the PSF licence history reports
          #   "Python-2.0 AND GPL-1.0-or-later AND ...". It stays exempt when
          #   Phase 2 makes it a runtime dependency (through pydantic); the
          #   licences hook reads its real metadata either way.
          # - numpy is a runtime dependency (ADR-0008 decision 14). Its SPDX
          #   expression adds 0BSD, Zlib and CC0-1.0 for bundled sources, all
          #   permissive; the licences hook allows it only through the
          #   reviewed entry in scripts/checks/licence_exceptions.toml, which
          #   the maintainer approved in Phase 2 Step 1.
          # - certifi (MPL-2.0) is runtime through [sdmx] from Phase 3 Step 8;
          #   its unmodified certificate bundle carries the maintainer-approved
          #   exception in licence_exceptions.toml. sdmx1's Apache classifier
          #   is ambiguous; its reviewed LICENSE is Apache-2.0.
          #   docutils remains docs-only; all-groups pip-audit covers both.
          # - Other docs-only packages flagged by dependency-review:
          #   astroid (LGPL-2.1-or-later, AutoAPI's static parser), parso
          #   (MIT AND Python-2.0), roman-numerals (BSD-3-Clause AND 0BSD AND
          #   CC0-1.0), and sphinx (BSD-2-Clause-Views AND BSD-3-Clause AND
          #   BSD-2-Clause). The licences hook excludes all four from the
          #   runtime closure; the all-groups audit still covers their
          #   locked versions.
          # - cffi (MIT-0, MIT No Attribution: MIT without the notice
          #   condition) is a runtime package since Phase 3 Step 3, reached
          #   only through the keyring extra on Linux (keyring ->
          #   SecretStorage -> cryptography -> cffi), and from Phase 4 Step 8
          #   through the mcp extra (mcp -> pyjwt[crypto] -> cryptography ->
          #   cffi). The licences hook allows it only through the reviewed
          #   entry in scripts/checks/licence_exceptions.toml, which the
          #   maintainer approved in Phase 3 Step 3.
          # - pywin32 (Windows only, through the mcp extra, Phase 4 Step 8)
          #   names only "PSF" in its metadata. Its licence files are
          #   BSD-3-Clause for win32, com and pythonwin, MIT, PSF-2.0 and a
          #   permissive HPND-style licence for bundled parts, and LGPL-2.1 for
          #   its separate adodbapi package, which nothing here imports. The
          #   licences hook allows it only through the reviewed entry the
          #   maintainer approved in that step.
          # - simplejson (MIT OR AFL-2.1; GitHub reads "(AFL-2.1 AND MIT AND
          #   Python-2.0) OR (AFL-2.1 AND MIT)") comes in only through vollib,
          #   the test group's implied-volatility oracle (Phase 2 Step 9). The
          #   licences hook confirms it is outside the runtime closure.
          # - patsy comes in through statsmodels, the econometrics extra
          #   (Phase 2 Step 12). GitHub reads "BSD-2-Clause AND Python-2.0":
          #   its LICENSE.txt is BSD-2-Clause, plus the permissive Python
          #   licence for the standard-library code in patsy/compat.py. The
          #   licences hook allows it only through the reviewed entry in
          #   scripts/checks/licence_exceptions.toml, approved in that step's
          #   pull request.
          # - quantecon (test group only, Phase 3 Step 14: the never-skipped
          #   oracle for macro.output_gap's Hamilton filter) publishes no licence
          #   metadata; its repository's LICENSE is BSD-3-Clause. It pulls in
          #   numba and llvmlite, whose LLVM part is Apache-2.0 WITH
          #   LLVM-exception beside BSD-2-Clause. None is in the runtime closure,
          #   which the licences hook checks; the all-groups audit covers them.
          # Step 10: maintainer-reviewed xlrd legacy BSD, peewee/protobuf
          # missing metadata, and multitasking Apache-2.0 exceptions. Exact
          # metadata and notices remain pinned by the local licences gate.
          # - argparse (npm, Phase 4 Step 7) is js-yaml's command-line parser,
          #   pulled in by @hey-api/openapi-ts in the tools/node workspace, a
          #   development tool that generates the CI-only TypeScript client.
          #   It is a port of CPython's argparse under the Python-2.0 licence
          #   (permissive, PSF lineage); never shipped, linked or published.
          # - @modelcontextprotocol/inspector (npm, Phase 4 Step 8) runs only in
          #   ci.yml's mcp-inspector job. Its metadata reads "SEE LICENSE IN
          #   LICENSE": the file is Apache-2.0, with MIT for contributions not
          #   yet relicensed, both allowed. Its web client brings Vite, whose CSS
          #   tool lightningcss (with one prebuilt package per platform) is
          #   MPL-2.0: a development tool, never shipped, linked or published.
          # - tslib (0BSD) ships to browsers in the web app, through radix-ui
          #   (Phase 5 Step 3). 0BSD, zero-clause BSD, is on the Phase 5 web
          #   allowlist for what ships (MIT, BSD, Apache-2.0, ISC, 0BSD), which
          #   scripts/checks/web_licences.py enforces; it grants more than MIT.
          # - The web app's build and test tools (web/ devDependencies, Phase 5
          #   Step 3), never shipped to browsers; scripts/checks/web_licences.py
          #   holds what ships to the permissive allowlist:
          #   - axe-core and @axe-core/playwright (MPL-2.0): Playwright's
          #     accessibility checks; Tailwind 4 and Astro's Vite also bring
          #     lightningcss (MPL-2.0, listed above);
          #   - sharp's prebuilt libvips packages (LGPL-3.0-or-later, and
          #     sharp-wasm32 and sharp-win32-* with Apache-2.0 and MIT): Astro's
          #     and miniflare's optional image service; the site processes no
          #     image at build time;
          #   - glob, minimatch, minipass, path-scurry, lru-cache, sax and
          #     common-ancestor-path (BlueOak-1.0.0, a permissive licence);
          #   - mdn-data, language-subtag-registry and @speed-highlight/core
          #     (CC0-1.0, public-domain dedication);
          #   - sentry (FSL-1.1-Apache-2.0, the Sentry CLI): reached through
          #     lighthouse -> @sentry/node, Lighthouse's own error reporting,
          #     which is off unless asked for; installed with --ignore-scripts.
          allow-dependencies-licenses: >-
            pkg:githubactions/trufflesecurity/trufflehog,
            pkg:npm/argparse,
            pkg:npm/%40axe-core/playwright,
            pkg:npm/@axe-core/playwright,
            pkg:npm/axe-core,
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/@img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/@img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/@img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/@img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/@img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/@img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/@img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/@img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/@img/sharp-wasm32,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/@img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/@img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64,
            pkg:npm/@img/sharp-win32-x64,
            pkg:npm/%40speed-highlight/core,
            pkg:npm/@speed-highlight/core,
            pkg:npm/common-ancestor-path,
            pkg:npm/glob,
            pkg:npm/language-subtag-registry,
            pkg:npm/lru-cache,
            pkg:npm/mdn-data,
            pkg:npm/minimatch,
            pkg:npm/minipass,
            pkg:npm/path-scurry,
            pkg:npm/sax,
            pkg:npm/sentry,
            pkg:npm/tslib,
            pkg:npm/%40modelcontextprotocol/inspector,
            pkg:npm/@modelcontextprotocol/inspector,
            pkg:npm/lightningcss,
            pkg:npm/lightningcss-android-arm64,
            pkg:npm/lightningcss-darwin-arm64,
            pkg:npm/lightningcss-darwin-x64,
            pkg:npm/lightningcss-freebsd-x64,
            pkg:npm/lightningcss-linux-arm-gnueabihf,
            pkg:npm/lightningcss-linux-arm64-gnu,
            pkg:npm/lightningcss-linux-arm64-musl,
            pkg:npm/lightningcss-linux-x64-gnu,
            pkg:npm/lightningcss-linux-x64-musl,
            pkg:npm/lightningcss-win32-arm64-msvc,
            pkg:npm/lightningcss-win32-x64-msvc,
            pkg:pypi/astroid,
            pkg:pypi/defusedxml,
            pkg:pypi/xlrd,
            pkg:pypi/peewee,
            pkg:pypi/multitasking,
            pkg:pypi/protobuf,
            pkg:pypi/pywin32,
            pkg:pypi/et-xmlfile,
            pkg:pypi/certifi,
            pkg:pypi/cffi,
            pkg:pypi/docutils,
            pkg:pypi/hypothesis,
            pkg:pypi/llvmlite,
            pkg:pypi/numpy,
            pkg:pypi/parso,
            pkg:pypi/pathspec,
            pkg:pypi/patsy,
            pkg:pypi/quantecon,
            pkg:pypi/roman-numerals,
            pkg:pypi/simplejson,
            pkg:pypi/sdmx1,
            pkg:pypi/sphinx,
            pkg:pypi/typing-extensions
          comment-summary-in-pr: never
