# .github/workflows/deploy-staging.yml
#
# Builds, scans, pushes and deploys the hosted-mode container image to Cloud Run
# staging (`pyeconomics-api-staging` in `us-central1`) on every push to `main`
# (and on `workflow_dispatch` from `main`), then verifies the deployment through
# the Cloudflare Worker edge (`staging-api.pyeconomics.dev`) using the
# Cloudflare Access service token, and rolls traffic back to the previous
# revision on any failure (Phase 4 Step 13; ADR-0012 decisions 11, 12, 19, 20).
#
# - Authenticates to Google Cloud via GitHub OIDC and Workload Identity
#   Federation (`google-github-actions/auth` v3 pinned by SHA, no service
#   account key input).
# - Runs in the protected `staging` environment (`main` only), where
#   `CF_ACCESS_CLIENT_ID` and `CF_ACCESS_CLIENT_SECRET` are stored as
#   environment secrets (never repository secrets).
# - Deploys without `--allow-unauthenticated`: the service keeps its
#   `allUsers` invoker binding between deploys, so the deploy identity needs
#   only `roles/run.developer` on the service and never sets its IAM policy
#   (#211). The origin `/version` check below fails if the binding is lost.
# - Then the `site` job (Phase 5 Step 4; ADR-0013 decisions 3, 4 and 9)
#   builds the staging flavour of the site from this commit and deploys it,
#   with the shared edge Worker, to `pyeconomics-web-staging` on
#   `staging.pyeconomics.dev` behind Access. `CLOUDFLARE_API_TOKEN` is an
#   account-owned token holding Workers Scripts: Edit (issue #231: per-Worker
#   roles grant nothing through the API yet): it uploads and deploys versions
#   (`wrangler versions upload`, then `versions deploy`) and rolls back, and
#   holds no route, custom-domain, DNS or Access permission, so `wrangler
#   deploy`, which rewrites the custom domain, stays the maintainer's. Only
#   the steps that call Wrangler see the token. The job
#   verifies the site through Access, runs the duration page's calculator, the
#   data explorer and a user-data upload in a browser against the staging API
#   (Phase 5 Steps 6 and 9) and, on failure, returns the Worker to the version
#   it served before and fails.
# - The deploy job also checks one golden case per domain through the edge
#   against the wheel's Python API (scripts/parity/check_deployed.py; Phase 5
#   Step 6, ADR-0013 decision 8) before it counts the API deployed.
# - Data before API (Phase 5 Step 8; ADR-0013 decision 6): the snapshot job
#   `GCP_SNAPSHOT_JOB` is updated to the new image digest, with its whole
#   configuration pinned here (hosted mode, the bucket mounted read-write at
#   /snapshots, one task, no retries, the provider keys from Secret Manager by
#   pinned version), before the API is deployed with the same bucket mounted
#   read-only and `PYECONOMICS_SNAPSHOT_DIR`. Cloud Scheduler runs the job
#   daily; this workflow does not. The checks then read Treasury's par curve
#   through the edge from the newest snapshot and a series outside the set as
#   `not-in-snapshot`; on failure the job returns to its previous image.

name: deploy-staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy and verify staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOST }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_SERVICE: ${{ vars.GCP_SERVICE }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      RATELIMIT_SECRET_VERSION: ${{ vars.RATELIMIT_SECRET_VERSION }}
      EDGE_SECRET_VERSION: ${{ vars.EDGE_SECRET_VERSION }}
      GCP_SNAPSHOT_JOB: ${{ vars.GCP_SNAPSHOT_JOB }}
      GCP_SNAPSHOT_BUCKET: ${{ vars.GCP_SNAPSHOT_BUCKET }}
      GCP_SNAPSHOT_SERVICE_ACCOUNT: ${{ vars.GCP_SNAPSHOT_SERVICE_ACCOUNT }}
      BEA_SECRET_VERSION: ${{ vars.BEA_SECRET_VERSION }}
      BLS_SECRET_VERSION: ${{ vars.BLS_SECRET_VERSION }}
      HEARTBEAT_SECRET_VERSION: ${{ vars.HEARTBEAT_SECRET_VERSION }}
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true

      # The venv holds the container's extras at uv.lock's versions (a result's
      # manifest records its dependencies' versions), so its runs are the
      # deployed API's: the run below and check_deployed.py's golden cases.
      - name: Build the wheel and compute expected run bytes in a clean venv
        shell: bash
        run: |
          set -euo pipefail
          uv build --no-config --wheel
          uv export --no-config --frozen --no-dev --no-emit-project \
            --extra server --extra mcp --extra econometrics --extra plot --extra sdmx \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" --require-hashes --requirement "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY' > "$RUNNER_TEMP/expected-run.json"
          import sys
          import pyeconomics

          res = pyeconomics.run(
              "foundations.time_value",
              {
                  "calculation": "future_value",
                  "present_value": 1000.0,
                  "rate": 0.05,
                  "periods": 10,
              },
          )
          sys.stdout.buffer.write(res.to_json().encode("utf-8"))
          PY
          "$RUNNER_TEMP/wheel-venv/bin/python" -c 'import pyeconomics; print(pyeconomics.__version__)' > "$RUNNER_TEMP/expected-version.txt"

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build the hosted container image with GIT_SHA
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repo="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/${GCP_SERVICE}"
          tag="${repo}:${GITHUB_SHA}"
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$tag" .
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Scan the image for fixable Critical or High vulnerabilities
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE_TAG"

      - name: Record the currently serving Cloud Run revision
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          prev=$(gcloud run services describe "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "previous_revision=${prev}" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ]; then
            echo "Current serving revision before deploy: ${prev}"
          else
            echo "No prior serving revision found (initial deploy)."
          fi

      - name: Push the image by SHA and resolve its digest
        id: push
        env:
          IMAGE_REPO: ${{ steps.image.outputs.repo }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          digest=$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')
          if [[ ! "$digest" =~ ^${IMAGE_REPO}@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Resolved digest '${digest}' is not a pinned @sha256 reference."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Record the snapshot job's current image
        id: previous_job
        shell: bash
        run: |
          set -euo pipefail
          prev=$(gcloud run jobs describe "$GCP_SNAPSHOT_JOB" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')
          echo "previous_image=${prev}" >> "$GITHUB_OUTPUT"
          echo "Snapshot job image before deploy: ${prev}"

      # Data before API: the job that writes the snapshot moves to the new image
      # first, with its configuration pinned here. Cloud Scheduler runs it daily.
      - name: Update the snapshot job to the new image digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          keys="BEA_API_KEY=bea-api-key:${BEA_SECRET_VERSION:-1},BLS_API_KEY=bls-api-key:${BLS_SECRET_VERSION:-1}"
          if [ -n "${HEARTBEAT_SECRET_VERSION:-}" ]; then
            keys="${keys},PYECONOMICS_SNAPSHOT_HEARTBEAT=snapshot-heartbeat:${HEARTBEAT_SECRET_VERSION}"
          fi
          gcloud run jobs update "$GCP_SNAPSHOT_JOB" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE_DIGEST" \
            --service-account="$GCP_SNAPSHOT_SERVICE_ACCOUNT" \
            --command=python \
            --args=-m,pyeconomics.server.snapshot_job,write \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=30m \
            --cpu=1 \
            --memory=2Gi \
            --set-env-vars="PYECONOMICS_MODE=hosted,PYECONOMICS_SNAPSHOT_DIR=/snapshots,PYECONOMICS_GIT_SHA=${GITHUB_SHA},PYECONOMICS_DEPLOYMENT=staging" \
            --set-secrets="$keys" \
            --clear-volume-mounts \
            --clear-volumes \
            --add-volume="name=snapshots,type=cloud-storage,bucket=${GCP_SNAPSHOT_BUCKET}" \
            --add-volume-mount="volume=snapshots,mount-path=/snapshots" \
            --quiet

      - name: Deploy the image by digest to Cloud Run with pinned secret versions
        id: deploy
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          ratelimit_ver="${RATELIMIT_SECRET_VERSION:-1}"
          edge_ver="${EDGE_SECRET_VERSION:-1}"
          gcloud run deploy "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE_DIGEST" \
            --service-account="$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=1Gi \
            --cpu-throttling \
            --timeout=60s \
            --concurrency=8 \
            --startup-probe=httpGet.path=/healthz,httpGet.port=8080,periodSeconds=5,timeoutSeconds=3,failureThreshold=24 \
            --ingress=all \
            --execution-environment=gen2 \
            --set-env-vars="PYECONOMICS_MODE=hosted,PYECONOMICS_WORKERS=2,PYECONOMICS_GIT_SHA=${GITHUB_SHA},PYECONOMICS_SNAPSHOT_DIR=/snapshots,PYECONOMICS_DEPLOYMENT=staging" \
            --set-secrets="PYECONOMICS_RATELIMIT_URL=ratelimit-url:${ratelimit_ver},PYECONOMICS_EDGE_CREDENTIAL=edge-credential:${edge_ver}" \
            --clear-volume-mounts \
            --clear-volumes \
            --add-volume="name=snapshots,type=cloud-storage,bucket=${GCP_SNAPSHOT_BUCKET},readonly=true" \
            --add-volume-mount="volume=snapshots,mount-path=/snapshots" \
            --quiet
          # A rollback pins traffic to a named revision, which leaves a new
          # revision at 0% (#210): return it to the latest before verifying.
          gcloud run services update-traffic "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --to-latest \
            --quiet
          origin_url=$(gcloud run services describe "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')
          probe_path=$(gcloud run services describe "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(spec.template.spec.containers[0].startupProbe.httpGet.path)')
          echo "origin_url=${origin_url}" >> "$GITHUB_OUTPUT"
          echo "probe_path=${probe_path}" >> "$GITHUB_OUTPUT"

      - name: Verify the origin and the edge deployment
        env:
          ORIGIN_URL: ${{ steps.deploy.outputs.origin_url }}
          STARTUP_PROBE_PATH: ${{ steps.deploy.outputs.probe_path }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          origin_url = os.environ["ORIGIN_URL"].rstrip("/")
          startup_probe_path = os.environ["STARTUP_PROBE_PATH"].strip()
          staging_host = os.environ["STAGING_HOST"].strip()
          edge_base = f"https://{staging_host}"
          git_sha = os.environ["GITHUB_SHA"].strip()
          client_id = os.environ["CF_ACCESS_CLIENT_ID"].strip()
          client_secret = os.environ["CF_ACCESS_CLIENT_SECRET"].strip()
          expected_run = pathlib.Path(os.environ["RUNNER_TEMP"], "expected-run.json").read_bytes()
          expected_version = (
              pathlib.Path(os.environ["RUNNER_TEMP"], "expected-version.txt")
              .read_text(encoding="utf-8")
              .strip()
          )

          def request(url: str, *, method: str = "GET", headers: dict[str, str] | None = None, body: bytes | None = None):
              req = urllib.request.Request(url, data=body, headers=headers or {}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      return resp.status, dict(resp.headers.items()), resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, dict(exc.headers.items()), exc.read()

          # 1. Cloud Run's HTTP startup probe is configured on /healthz:8080, and
          #    the origin's open /version endpoint answers 200 (Google Frontend
          #    reserves /healthz on *.run.app external URLs).
          assert startup_probe_path == "/healthz", (
              f"unexpected Cloud Run startupProbe path: {startup_probe_path!r}"
          )
          status, _, body = request(f"{origin_url}/version")
          assert status == 200, f"origin /version returned {status}"
          assert json.loads(body) == {
              "pyeconomics": expected_version,
              "git_sha": git_sha,
              "mode": "hosted",
          }, f"unexpected origin /version payload: {body!r}"

          # 2. Direct /v1 and /mcp requests to the origin without the edge credential answer 403.
          status, _, body = request(f"{origin_url}/v1/models")
          assert status == 403, f"direct origin /v1/models returned {status}, expected 403"
          problem = json.loads(body)
          assert problem["type"].endswith("/problems/edge-required"), problem

          status, _, body = request(
              f"{origin_url}/mcp",
              method="POST",
              headers={"Content-Type": "application/json"},
              body=b'{"jsonrpc":"2.0","id":1,"method":"tools/list"}',
          )
          assert status == 403, f"direct origin /mcp returned {status}, expected 403"

          # 3. Without the Cloudflare Access service token, the staging hostname refuses.
          no_redirect = urllib.request.build_opener(
              type(
                  "_NoRedirect",
                  (urllib.request.HTTPRedirectHandler,),
                  {"redirect_request": lambda self, req, fp, code, msg, hdrs, newurl: None},
              )
          )
          unauth_req = urllib.request.Request(
              f"{edge_base}/version",
              headers={"User-Agent": "pyeconomics-deploy-check/1.0"},
          )
          try:
              with no_redirect.open(unauth_req, timeout=30) as resp:
                  unauth_status = resp.status
          except urllib.error.HTTPError as exc:
              unauth_status = exc.code
          assert unauth_status in {302, 303, 401, 403}, (
              f"unauthenticated staging hostname returned {unauth_status}, expected Access refusal"
          )

          access_headers = {
              "CF-Access-Client-Id": client_id,
              "CF-Access-Client-Secret": client_secret,
              "User-Agent": "pyeconomics-deploy-check/1.0",
          }

          # 4. Through the edge with the service token, /healthz answers 200 {"status": "ok"}
          #    and /version matches this commit and hosted mode.
          status, _, body = request(f"{edge_base}/healthz", headers=access_headers)
          assert status == 200, f"edge /healthz returned {status}"
          assert json.loads(body) == {"status": "ok"}, f"unexpected edge /healthz payload: {body!r}"

          status, _, body = request(f"{edge_base}/version", headers=access_headers)
          assert status == 200, f"edge /version returned {status}"
          version_doc = json.loads(body)
          assert version_doc == {
              "pyeconomics": expected_version,
              "git_sha": git_sha,
              "mode": "hosted",
          }, f"unexpected /version payload: {version_doc}"

          # 5. Through the edge, a data-free run equals the wheel's bytes computed in this job.
          status, _, body = request(
              f"{edge_base}/v1/models/foundations.time_value/run",
              method="POST",
              headers={**access_headers, "Content-Type": "application/json"},
              body=b'{"calculation":"future_value","present_value":1000.0,"rate":0.05,"periods":10}',
          )
          assert status == 200, f"edge run returned {status}"
          assert body == expected_run, "edge run bytes differed from wheel Result.to_json() bytes"

          # 6. A hosted-safe series answers 200 with its attribution.
          status, _, body = request(
              f"{edge_base}/v1/series/treasury:debt?start=2025-01-01&end=2025-01-31",
              headers=access_headers,
          )
          assert status == 200, f"edge hosted-safe series returned {status}"
          series_doc = json.loads(body)
          assert series_doc["sources"][0]["provider"] == "treasury", series_doc["sources"]
          assert series_doc["sources"][0]["licence"] == "hosted-safe", series_doc["sources"]
          assert any("Treasury" in a for a in series_doc["attributions"]), series_doc["attributions"]

          # 7. A library-only series answers 403 licence-refused with its terms URL.
          status, _, body = request(
              f"{edge_base}/v1/series/fred:UNRATE",
              headers=access_headers,
          )
          assert status == 403, f"edge library-only series returned {status}, expected 403"
          refusal = json.loads(body)
          assert refusal["type"].endswith("/problems/licence-refused"), refusal
          assert refusal.get("terms"), refusal

          # 8. Phase 5 Step 8: Treasury's par curve answers from the newest
          #    snapshot (retrieved within the last two days, not stale), and a
          #    series outside the snapshot set answers 404 not-in-snapshot.
          now = dt.datetime.now(dt.UTC)
          start = (now - dt.timedelta(days=14)).date().isoformat()
          status, _, body = request(
              f"{edge_base}/v1/series/treasury:par_nominal?start={start}&end={now.date().isoformat()}",
              headers=access_headers,
          )
          assert status == 200, f"edge snapshot series returned {status}: {body[:300]!r}"
          record = json.loads(body)["sources"][0]
          assert "served_from_snapshot" in record["warnings"], record
          assert "stale_snapshot" not in record["warnings"], record
          retrieved = dt.datetime.fromisoformat(record["retrieved_at"])
          assert now - retrieved < dt.timedelta(days=2), record["retrieved_at"]
          status, _, body = request(
              f"{edge_base}/v1/series/treasury:statement",
              headers=access_headers,
          )
          assert status == 404, f"edge series outside the snapshot returned {status}"
          assert json.loads(body)["type"].endswith("/problems/not-in-snapshot"), body
          print("All origin and edge staging checks passed.")
          PY

      # Phase 5 Step 6 (ADR-0013 decision 8): the first golden case of each
      # domain through the edge, compared with the wheel's Python API in the
      # venv above. The working directory is outside the checkout, so the
      # installed wheel answers, never the source tree.
      - name: Check one golden case per domain through the deployed API
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          golden="$PWD/tests/golden"
          check="$PWD/scripts/parity/check_deployed.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -I "$check" "$golden" "https://${STAGING_HOST}"

      - name: Return the snapshot job to its previous image on failure
        if: failure() && steps.previous_job.outputs.previous_image != ''
        env:
          PREVIOUS_IMAGE: ${{ steps.previous_job.outputs.previous_image }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Staging deploy or verification failed; returning the snapshot job to ${PREVIOUS_IMAGE}."
          gcloud run jobs update "$GCP_SNAPSHOT_JOB" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$PREVIOUS_IMAGE" \
            --quiet

      - name: Route traffic back to the previous revision on failure
        if: failure() && steps.previous.outputs.previous_revision != ''
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.previous_revision }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Staging deploy or verification failed; routing 100% of traffic back to ${PREVIOUS_REVISION}."
          gcloud run services update-traffic "$GCP_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --to-revisions="${PREVIOUS_REVISION}=100" \
            --quiet

  site:
    name: deploy and verify the staging site
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_SITE_HOST }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      STAGING_SITE_HOST: ${{ vars.STAGING_SITE_HOST }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true

      - name: Set up Node.js from web/.nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc

      # npm ci installs exactly the lockfile; no package may run an install script.
      - name: Install the site's tools from their lockfile
        working-directory: web
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Export the site data from this commit
        working-directory: web
        run: npm run data

      # scripts/headers.ts writes dist/_headers with X-Robots-Tag: noindex.
      - name: Build the staging flavour of the site
        working-directory: web
        env:
          SITE_FLAVOUR: staging
          GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Record the Worker version serving now
        id: previous
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deployments status --env staging --json > "$RUNNER_TEMP/deployment.json"
          previous=$(python3 - "$RUNNER_TEMP/deployment.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              deployment = json.load(handle)
          whole = [v["version_id"] for v in deployment.get("versions", []) if v.get("percentage") == 100]
          print(whole[0] if len(whole) == 1 else "")
          PY
          )
          echo "previous_version=${previous}" >> "$GITHUB_OUTPUT"
          echo "Worker version serving before this deploy: ${previous:-none}"

      - name: Upload the site as a new Worker version and deploy it
        id: release
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler versions upload --env staging --message "deploy-staging ${GITHUB_SHA}"
          version=$(python3 - "$WRANGLER_OUTPUT_FILE_PATH" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              entries = [json.loads(line) for line in handle if line.strip()]
          uploads = [e["version_id"] for e in entries if e.get("type") == "version-upload"]
          print(uploads[-1] if uploads else "")
          PY
          )
          if [[ ! "$version" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::wrangler versions upload reported no version id."
            exit 1
          fi
          npx --no-install wrangler versions deploy "${version}@100%" --env staging \
            --message "deploy-staging ${GITHUB_SHA}" --yes
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify the site and the API through Access
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.request

          base = f"https://{os.environ['STAGING_SITE_HOST'].strip()}"
          git_sha = os.environ["GITHUB_SHA"].strip()
          agent = {"User-Agent": "pyeconomics-deploy-check/1.0"}
          access = {
              "CF-Access-Client-Id": os.environ["CF_ACCESS_CLIENT_ID"].strip(),
              "CF-Access-Client-Secret": os.environ["CF_ACCESS_CLIENT_SECRET"].strip(),
              **agent,
          }
          generated = pathlib.Path("web/src/data/generated/registry.json")
          expected_version = json.loads(generated.read_text(encoding="utf-8"))["pyeconomics"]
          policy_lines = [
              line.strip()
              for line in pathlib.Path("web/dist/_headers").read_text(encoding="utf-8").splitlines()
              if line.strip().startswith("Content-Security-Policy:")
          ]
          assert len(policy_lines) == 1, "dist/_headers must hold one Content-Security-Policy"
          expected_policy = policy_lines[0].split(":", 1)[1].strip()

          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(_NoRedirect)

          def request(path: str, headers: dict[str, str]):
              req = urllib.request.Request(f"{base}{path}", headers=headers)
              try:
                  with opener.open(req, timeout=30) as resp:
                      return resp.status, resp.headers, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.headers, exc.read()

          # 1. Without the service token, Access refuses the host: pages and API alike.
          for path in ("/", "/version.json", "/v1/models"):
              status, _, _ = request(path, agent)
              assert status in {302, 303, 401, 403}, (
                  f"unauthenticated {path} returned {status}, expected Access refusal"
              )

          # 2. /version.json reports this commit once the new version has propagated.
          deadline = time.monotonic() + 120
          while True:
              status, _, body = request("/version.json", access)
              found = json.loads(body) if status == 200 else None
              if found == {"pyeconomics": expected_version, "git_sha": git_sha}:
                  break
              assert time.monotonic() < deadline, f"/version.json returned {status}: {found}"
              time.sleep(5)

          # 3. Pages carry the build's exact policy. A deploy at 100% reaches every
          # Cloudflare location over seconds, so a page may still come from the old
          # version just after /version.json reports the new one: read each until its
          # policy matches, and on the deadline name the directives that differ (the
          # policy is public; every response carries it).
          deadline = time.monotonic() + 120

          def directives(policy):
              pairs = (part.strip().split(None, 1) + [""] for part in (policy or "").split(";") if part.strip())
              return {pair[0]: pair[1] for pair in pairs}

          def settled(path):
              while True:
                  status, headers, _ = request(path, access)
                  policy = headers.get("Content-Security-Policy")
                  if status == 200 and policy == expected_policy:
                      return headers
                  if time.monotonic() >= deadline:
                      built, served = directives(expected_policy), directives(policy)
                      differ = sorted(k for k in built.keys() | served.keys() if built.get(k) != served.get(k))
                      detail = "; ".join(f"{k}: built {built.get(k)!r}, served {served.get(k)!r}" for k in differ)
                      raise AssertionError(f"{path} returned {status}; its policy differs in {detail or 'nothing'}")
                  time.sleep(5)

          # The home page refuses indexing.
          headers = settled("/")
          assert headers.get("X-Robots-Tag") == "noindex", "/ does not refuse indexing"
          assert headers.get("X-Content-Type-Options") == "nosniff"

          # 3b. A model page and a problem page answer the same way, robots.txt
          # refuses every path, and the sitemap lists every model's page.
          for path in ("/models/fixed-income/duration/", "/problems/invalid-input/"):
              headers = settled(path)
              assert headers.get("X-Robots-Tag") == "noindex", f"{path} does not refuse indexing"
          status, _, body = request("/robots.txt", access)
          assert status == 200 and b"Disallow: /\n" in body, f"/robots.txt returned {status}: {body[:80]!r}"
          status, _, body = request("/sitemap-index.xml", access)
          assert status == 200, f"/sitemap-index.xml returned {status}"
          production = "https://pyeconomics.dev"
          listed = []
          for location in re.findall(r"<loc>([^<]+)</loc>", body.decode("utf-8")):
              assert location.startswith(f"{production}/"), f"the sitemap index lists {location}"
              status, _, sitemap = request(location[len(production):], access)
              assert status == 200, f"{location} returned {status}"
              listed += re.findall(r"<loc>([^<]+)</loc>", sitemap.decode("utf-8"))
          models = json.loads(generated.read_text(encoding="utf-8"))["models"]
          expected_pages = {
              f"{production}/models/{m['id'].replace('_', '-').replace('.', '/')}/" for m in models
          }
          assert expected_pages <= set(listed), f"the sitemap lacks {sorted(expected_pages - set(listed))[:3]}"
          print(f"The sitemap lists all {len(expected_pages)} model pages.")

          # 4. The API answers on the same host, through the shared edge Worker.
          status, headers, body = request("/v1/models", access)
          assert status == 200, f"/v1/models returned {status}"
          assert headers.get("X-Content-Type-Options") == "nosniff", "the API response lacks nosniff"
          assert json.loads(body), "/v1/models answered an empty document"
          status, _, body = request("/healthz", access)
          assert status == 200 and json.loads(body) == {"status": "ok"}, f"/healthz returned {status}"

          # 5. A GET run goes through the Worker's cache path (Phase 5 Step 13):
          # twice the same bytes and the origin's Cache-Control, whether or not
          # the Cache API works behind Access. ?inputs= is the inputs' JSON in
          # base64url without padding.
          inputs = b'{"calculation":"future_value","present_value":1000.0,"rate":0.05,"periods":10}'
          encoded = base64.urlsafe_b64encode(inputs).rstrip(b"=").decode("ascii")
          run = f"/v1/models/foundations.time_value/run?inputs={encoded}"
          status, headers, first = request(run, access)
          assert status == 200, f"GET run returned {status}"
          assert headers.get("Cache-Control") == "public, max-age=86400", headers.get("Cache-Control")
          status, _, second = request(run, access)
          assert status == 200 and second == first, f"second GET run returned {status}"
          print("All staging site checks passed.")
          PY

      # Phase 5 Step 6: a browser fills the duration page's calculator and runs
      # it against the staging API on the same origin, through Access. Phase 5
      # Step 9: the series route applies a transform, /data/ charts a concept
      # with its attribution, and a run fed from an uploaded CSV sends only its
      # POST (tests/staging/).
      - name: Install Playwright's Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Run the calculator, the explorer and an upload on staging in a browser
        working-directory: web
        env:
          STAGING_BASE_URL: https://${{ vars.STAGING_SITE_HOST }}
          GIT_SHA: ${{ github.sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx --no-install playwright test --config playwright.staging.config.ts

      - name: Return the Worker to the previous version on failure
        if: failure() && steps.previous.outputs.previous_version != '' && steps.release.outcome != 'skipped'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous_version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Staging site deploy or verification failed; rolling the Worker back to ${PREVIOUS_VERSION}."
          npx --no-install wrangler rollback "$PREVIOUS_VERSION" --env staging \
            --message "deploy-staging ${GITHUB_SHA} failed verification" --yes
